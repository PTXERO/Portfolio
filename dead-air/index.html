<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050508">
<title>DEAD//AIR</title>
<script src="../design-tokens.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bungee&family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
html,body{height:100%;overflow:hidden;background:#050508;}
body{-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;}
button{font:inherit;color:inherit;}
[hidden]{display:none!important;}
.page-header{flex:none;}
.hdr-btn{font-family:var(--fmono);font-size:10px;letter-spacing:.12em;color:var(--dim);
  background:none;border:1px solid var(--b2);border-radius:2px;padding:4px 9px;cursor:pointer;}
.hdr-btn:hover{color:var(--acc);border-color:var(--acc);}
.room{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
.stage{position:relative;height:100%;aspect-ratio:540/960;max-width:100vw;overflow:hidden;container-type:inline-size;}
@media(max-aspect-ratio:540/960){.stage{height:auto;width:100vw;}}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer;}

/* ── Stage buttons ─────────────────────────────────────── */
.pad{position:absolute;left:4%;right:4%;bottom:2.2%;display:flex;gap:3%;}
.pad button{font-family:var(--fdisp);letter-spacing:.12em;border-radius:6px;cursor:pointer;line-height:1;
  padding:3.2cqw 1cqw 2.6cqw;font-size:8cqw;border:0;transition:transform .06s,filter .15s;touch-action:manipulation;}
.pad button small{display:block;font-family:var(--fmono);font-size:2.6cqw;letter-spacing:.14em;margin-top:.8cqw;opacity:.75;}
.pad button:active{transform:translateY(3px);}
.pad button:disabled{filter:grayscale(1) brightness(.45);cursor:not-allowed;}
#buzz{flex:1.3;background:#e8203a;color:#fff;box-shadow:0 5px 0 #7a0c1a,0 0 30px rgba(232,32,58,.5);}
#bank{flex:1;background:var(--acc);color:#07070a;box-shadow:0 5px 0 #5a6a20,0 0 24px rgba(200,245,66,.35);}
#slow{flex:.62;background:#7fe0ff;color:#07070a;box-shadow:0 5px 0 #2a6a80,0 0 20px rgba(127,224,255,.35);}
.cards.two{grid-template-columns:1fr 1fr;}
.card.rare{border-color:#ffd24a;box-shadow:0 0 18px rgba(255,210,74,.35);}
.card .plus{display:inline-block;font-family:var(--fmono);font-size:9px;letter-spacing:.12em;color:#07070a;background:#ffd24a;border-radius:2px;padding:1px 6px;margin-top:6px;}
#spin{flex:1;background:#ffd24a;color:#07070a;box-shadow:0 5px 0 #8a6a10,0 0 30px rgba(255,210,74,.45);}
.result{position:absolute;left:5%;right:5%;bottom:15%;text-align:center;pointer-events:none;}
.result b{display:block;font-family:var(--fdisp);font-weight:400;font-size:8cqw;letter-spacing:.08em;line-height:1;color:#fff;text-shadow:0 0 14px #000,2px 2px 0 #f542a8;}
.result span{display:block;font-size:3cqw;line-height:1.5;color:#d8d8e0;margin-top:1.2cqw;text-shadow:0 0 8px #000,0 0 8px #000;}

/* ── Overlays on top of the stage ──────────────────────── */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5% 6%;text-align:center;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 35%,rgba(7,7,10,.72),rgba(7,7,10,.93));}
.ov.low{justify-content:flex-end;padding-bottom:4%;background:linear-gradient(rgba(7,7,10,0) 30%,rgba(7,7,10,.9) 52%);}
#ovTitle{background:radial-gradient(ellipse at 50% 40%,rgba(10,6,24,.9),rgba(10,6,24,.96));}
.logo{margin-bottom:16px;}
.onair{font-family:var(--fmono);font-size:10px;letter-spacing:.3em;color:#fff;background:#e8203a;
  border-radius:2px;padding:3px 10px;box-shadow:0 0 18px #e8203a;animation:blink 1.6s steps(2) infinite;}
@keyframes blink{50%{opacity:.45}}
.logo{font-family:var(--fdisp);font-size:clamp(58px,20vmin,104px);line-height:.95;letter-spacing:.06em;color:#fff;
  margin:12px 0 4px;text-shadow:0 0 28px rgba(200,245,66,.35),4px 4px 0 #f542a8;}
.logo em{font-style:normal;color:var(--acc);}
.pitch{font-size:12px;line-height:1.7;color:#b9b9c6;max-width:360px;margin:0 auto 14px;}
.big-btn{display:block;width:100%;max-width:380px;font-family:var(--fdisp);font-size:26px;letter-spacing:.14em;
  padding:12px 10px 9px;border:1px solid var(--acc);border-radius:3px;cursor:pointer;margin:0 auto;
  background:var(--acc);color:#07070a;box-shadow:0 0 26px rgba(200,245,66,.35);transition:transform .08s,filter .15s;}
.big-btn:hover{filter:brightness(1.1);}
.big-btn:active{transform:translateY(2px);}
.big-btn.alt{background:rgba(7,7,10,.6);color:var(--acc);box-shadow:none;margin-top:8px;}
.who{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 auto 12px;text-align:left;width:100%;max-width:380px;}
.who button{border:1px solid var(--b2);border-radius:3px;background:rgba(16,16,21,.85);padding:7px 8px;cursor:pointer;text-align:left;}
.who b{display:block;font-family:var(--fmono);font-weight:400;font-size:10.5px;letter-spacing:.1em;color:var(--txt);}
.who span{display:block;font-size:10px;line-height:1.4;color:#8a8aa0;margin-top:2px;}
.who button.on{border-color:var(--acc);background:rgba(200,245,66,.08);}
.who button.on b{color:var(--acc);}
.who button:disabled{cursor:not-allowed;border-style:dashed;}
.who button:disabled b{color:var(--dim);}
.how{font-size:11px;line-height:1.7;color:#b9b9c6;max-width:380px;margin:12px auto 0;}
.how b{font-weight:400;color:var(--acc4)}.how i{font-style:normal;color:var(--acc2)}.how u{text-decoration:none;color:var(--acc3)}
.stats{display:flex;justify-content:center;gap:18px;margin:12px 0 0;}
.stats div{font-family:var(--fmono);font-size:9px;letter-spacing:.14em;color:#8a8aa0;}
.stats b{display:block;font-family:var(--fdisp);font-size:22px;font-weight:400;color:var(--txt);letter-spacing:.06em;}
.ov h1{font-family:var(--fdisp);font-weight:400;font-size:clamp(34px,11vmin,58px);letter-spacing:.1em;line-height:1;color:var(--acc);
  text-shadow:3px 3px 0 #f542a8;}
.ov h1.bad{color:var(--acc3);text-shadow:3px 3px 0 #42d4f5;}
.ov .sub{font-size:12px;color:#d8d8e0;margin:8px 0 12px;line-height:1.6;text-shadow:0 0 8px #000;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;}
.card{border:1px solid var(--b2);border-top:3px solid var(--c);border-radius:3px;background:rgba(16,16,21,.95);padding:9px 7px 10px;
  cursor:pointer;text-align:center;transition:transform .12s,border-color .12s;min-height:150px;}
.card:hover{transform:translateY(-4px);border-color:var(--c);}
.card img{width:52px;height:52px;display:block;margin:0 auto;filter:drop-shadow(0 0 8px var(--c));}
.kit img{flex:none;width:34px;height:34px;}
.card .k{display:block;font-family:var(--fmono);font-size:9px;letter-spacing:.14em;color:var(--c);margin-top:8px;}
.card b{display:block;font-family:var(--fdisp);font-weight:400;font-size:18px;letter-spacing:.06em;line-height:1.05;color:#fff;margin:3px 0 4px;}
.card p{font-size:10.5px;line-height:1.45;color:#b9b9c6;}
.rows{width:100%;max-width:300px;margin:4px auto 16px;}
.row{display:flex;justify-content:space-between;font-family:var(--fmono);font-size:11px;letter-spacing:.08em;color:#8a8aa0;padding:3px 0;}
.row b{font-weight:400;color:var(--txt);}
.kit{width:100%;max-width:400px;text-align:left;margin:0 auto 14px;}
.kit div{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border);}
.kit .chip{flex:none;font-family:var(--fmono);font-size:10px;letter-spacing:.06em;border:1px solid var(--c);color:var(--c);border-radius:2px;padding:1px 5px;min-width:44px;text-align:center;}
.kit b{display:block;font-family:var(--fmono);font-weight:400;font-size:11px;letter-spacing:.1em;color:#fff;}
.kit span{font-size:10.5px;line-height:1.45;color:#b9b9c6;}

/* ── House style "Misprint": ink outlines, hard offset shadows, sign lettering ── */
.logo,.ov h1{font-family:'Bungee','Bebas Neue',sans-serif;letter-spacing:.01em;}
.logo{font-size:clamp(40px,13.5vmin,72px);text-shadow:4px 4px 0 #f542a8,-2px -2px 0 #42d4f5;}
.ov h1{font-size:clamp(26px,8vmin,42px);text-shadow:3px 3px 0 #f542a8,-2px -2px 0 #150f24;}
.big-btn{border:3px solid #150f24;box-shadow:5px 5px 0 #150f24;border-radius:6px;}
.big-btn.alt{border-color:var(--acc);box-shadow:5px 5px 0 #150f24;}
.pad button{border:3px solid #150f24;}
#buzz{box-shadow:0 6px 0 #150f24;}#bank{box-shadow:0 6px 0 #150f24;}#slow{box-shadow:0 6px 0 #150f24;}#spin{box-shadow:0 6px 0 #150f24;}
.card{border:3px solid #150f24;border-top:3px solid #150f24;border-radius:8px;background:#241848;box-shadow:5px 5px 0 var(--c);}
.card:nth-child(odd){transform:rotate(-1.2deg);}.card:nth-child(even){transform:rotate(1deg);}
.card:hover{transform:translateY(-5px) rotate(0);border-color:#150f24;}
.card.rare{border-color:#150f24;box-shadow:5px 5px 0 #ffd24a,0 0 22px rgba(255,210,74,.5);}
.card img{width:64px;height:64px;filter:none;}
.kit img{width:40px;height:40px;}
.who button{border:2px solid #150f24;background:#241848;box-shadow:3px 3px 0 #150f24;border-radius:6px;}
.who button.on{border-color:#150f24;background:#3a2878;box-shadow:3px 3px 0 var(--acc);}
.who button:disabled{border-style:dashed;border-color:#4a3a90;box-shadow:none;background:rgba(36,24,72,.6);}
.onair{border:2px solid #150f24;box-shadow:3px 3px 0 #150f24;}
.shop div{align-items:center;}
.shop p{flex:1;}
.shop button{flex:none;font-family:var(--fmono);font-size:10px;letter-spacing:.08em;padding:6px 8px;border:2px solid #150f24;border-radius:4px;
  background:#ffd24a;color:#07070a;box-shadow:3px 3px 0 #150f24;cursor:pointer;min-width:74px;}
.shop button:disabled{background:#3a2878;color:#8a8aa0;box-shadow:none;cursor:not-allowed;}
.shop .saving{display:block;height:5px;margin-top:5px;border:1px solid #150f24;border-radius:3px;background:#0d0a1c;overflow:hidden;}
.shop .saving i{display:block;height:100%;background:#ffd24a;}
.shop .pips{display:block;font-family:var(--fmono);font-size:9px;letter-spacing:.2em;color:#ffd24a;margin:2px 0;}
#resume{margin-bottom:8px;background:#ffd24a;border-color:#150f24;}
#ovDump{background:#1a1238;justify-content:flex-start;}
.row3{display:flex;gap:6px;width:100%;max-width:380px;margin:8px auto 0;}
.row3 .big-btn{flex:1;margin:0;font-size:15px;letter-spacing:.06em;padding:11px 2px 9px;line-height:1.1;}
#toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:none;
  font-family:var(--fmono);font-size:11px;letter-spacing:.08em;color:#07070a;background:#ffd24a;border:3px solid #150f24;border-radius:6px;padding:5px 12px 5px 6px;box-shadow:4px 4px 0 #150f24;animation:toastIn .35s cubic-bezier(.2,1.6,.4,1);}
#toast img{width:30px;height:30px;}
#toast b{font-family:var(--fdisp);font-weight:400;font-size:15px;display:block;line-height:1.1;}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-30px) scale(.7);opacity:0;}}
.build{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:330px;margin:0 auto 12px;}
.build span{position:relative;width:30px;height:30px;}
.build img{width:30px;height:30px;display:block;}
.build i{position:absolute;right:-2px;bottom:-3px;font-style:normal;font-family:var(--fmono);font-size:8px;line-height:1;color:#fff;background:#150f24;border-radius:2px;padding:1px 2px;}
.build i.evo{background:#ffd24a;color:#07070a;}
.hist{font-family:var(--fmono);font-size:9.5px;letter-spacing:.06em;color:#b9b9c6;text-align:left;display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #2a2050;}
.hist b{font-weight:400;color:#fff;min-width:74px;}
.hist b.won{color:#c8f542;}
.hist span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kit .evohint{display:flex;align-items:center;gap:3px;margin-top:2px;color:#ffd24a;font-family:var(--fmono);font-size:8.5px;letter-spacing:.08em;}
.kit .evohint img{width:17px;height:17px;}
.who button b i{font-style:normal;color:#ffd24a;margin-left:4px;}
.pick1{display:flex;align-items:stretch;gap:6px;width:100%;max-width:380px;margin:0 auto 4px;}
.pick1 .arr{flex:none;width:34px;border:2px solid #150f24;border-radius:6px;background:#241848;color:#c8f542;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 #150f24;}
.pcard{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;border:2px solid #150f24;border-radius:6px;background:#3a2878;box-shadow:3px 3px 0 var(--acc);padding:6px 8px;min-height:86px;}
.pcard.locked{background:rgba(36,24,72,.6);box-shadow:none;border-style:dashed;border-color:#4a3a90;}
.pcard.locked img{filter:brightness(0) opacity(.45);}
.pcard>img{flex:none;width:66px;height:66px;}
.ptxt{min-width:0;}
.ptxt b{display:block;font-family:var(--fdisp);font-weight:400;font-size:17px;letter-spacing:.05em;line-height:1.05;color:#fff;}
.ptxt b i{font-style:normal;color:#ffd24a;margin-left:5px;font-size:13px;}
.ptxt em{display:block;font-style:normal;font-family:var(--fmono);font-size:9px;letter-spacing:.14em;color:#c8f542;margin-top:3px;}
.ptxt span{display:block;font-size:10.5px;line-height:1.35;color:#d8d8e8;}
#whoKit{display:flex;gap:3px;margin-top:3px;min-height:20px;}
#whoKit img{width:20px;height:20px;}
.dots{display:flex;gap:4px;justify-content:center;margin:5px 0 10px;}
.dots i{width:6px;height:6px;border-radius:50%;background:#3a2878;}
.dots i.ok{background:#6a55c8;}
.dots i.on{background:#c8f542;}
#ovTitle{justify-content:flex-start;padding-top:10px;overflow-y:auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:380px;margin:0 auto 10px;padding-left:44px;}
.wallet{display:flex;align-items:center;gap:6px;background:#150f24;border:2px solid #ffd24a;border-radius:20px;padding:2px 12px 2px 3px;box-shadow:3px 3px 0 #150f24;}
.wallet img{width:26px;height:26px;}
.wallet b{font-family:var(--fdisp);font-weight:400;font-size:19px;letter-spacing:.04em;color:#ffd24a;}
.jackp{text-align:right;line-height:1.1;}
.jackp small{display:block;font-family:var(--fmono);font-size:8px;letter-spacing:.2em;color:#8a8aa0;}
.jackp b{font-family:var(--fdisp);font-weight:400;font-size:15px;letter-spacing:.04em;color:#ff6bd6;}
#ovTitle .logo{margin-bottom:10px;font-size:clamp(40px,13.5vmin,58px);}
#ovTitle::before,#ovTitle::after{content:'';flex:1 0 0;}
.setup #heatBtn{border-color:#150f24;color:inherit;}
.setup{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:380px;margin:0 auto;border:2px solid #150f24;border-radius:6px;overflow:hidden;box-shadow:3px 3px 0 #150f24;}
.setup button{border:0;border-right:2px solid #150f24;background:#241848;padding:6px 2px 5px;cursor:pointer;line-height:1.15;}
.setup button:last-child{border-right:0;}
.setup button:active{background:#3a2878;}
.setup small{display:block;font-family:var(--fmono);font-size:8px;letter-spacing:.2em;color:#8a8aa0;}
.setup b{display:block;font-family:var(--fdisp);font-weight:400;font-size:15px;letter-spacing:.05em;color:#fff;white-space:nowrap;}
.setup button.hot b{color:#ff9a2e;}
.setup button.off{cursor:default;}
.setup button.off b{color:#5a4a90;font-size:11px;font-family:var(--fmono);letter-spacing:.08em;padding-top:3px;}
#ovTitle .heatinfo{min-height:0;margin:4px 0 8px;max-width:380px;line-height:1.4;}
#ovTitle .heatinfo:empty{margin:0 0 10px;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px;margin:10px auto 0;}
.tile{position:relative;display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border:2px solid #150f24;border-radius:6px;
  background:#241848;box-shadow:4px 4px 0 #150f24;padding:7px 8px;cursor:pointer;}
.tile:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #150f24;}
.tile img{grid-row:1 / 3;width:44px;height:44px;}
.tile b{font-family:var(--fdisp);font-weight:400;font-size:15px;letter-spacing:.05em;line-height:1.05;color:#c8f542;align-self:end;}
.tile span{font-family:var(--fmono);font-size:9px;letter-spacing:.08em;color:#b9b9c6;align-self:start;white-space:nowrap;}
.tile.can{border-color:#ffd24a;}
.tile.can::after{content:'!';position:absolute;right:-7px;top:-8px;width:19px;height:19px;border-radius:50%;background:#ffd24a;color:#07070a;border:2px solid #150f24;
  font-family:var(--fdisp);font-size:13px;line-height:17px;text-align:center;animation:pip 1s ease-in-out infinite;}
@keyframes pip{50%{transform:scale(1.2);}}
#ovTitle .stats{gap:14px;margin-top:12px;}
#ovTitle .stats b{font-size:17px;}
#ovTitle .stats div{font-size:8px;}
.betbox{width:100%;margin-top:14px;border:2px solid #150f24;border-radius:6px;background:#1a1238;box-shadow:4px 4px 0 #150f24;padding:7px 8px 8px;}
.bethead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.bethead b{font-family:var(--fdisp);font-weight:400;font-size:15px;letter-spacing:.06em;color:#ffd24a;}
.bethead span{font-family:var(--fmono);font-size:9px;letter-spacing:.14em;color:#b9b9c6;}
.bets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.bets button{border:2px solid #4a3a90;border-radius:6px;background:#241848;padding:8px 2px 6px;cursor:pointer;line-height:1.1;min-height:46px;}
.bets button b{display:block;font-family:var(--fdisp);font-weight:400;font-size:17px;letter-spacing:.04em;color:#fff;}
.bets button span{display:block;font-family:var(--fmono);font-size:8px;letter-spacing:.06em;color:#c8f542;margin-top:2px;white-space:nowrap;}
.bets button.on{background:#ffd24a;border-color:#150f24;box-shadow:3px 3px 0 #150f24;}
.bets button.on b,.bets button.on span{color:#07070a;}
.bets button:disabled{cursor:not-allowed;border-style:dashed;background:transparent;}
.bets button:disabled b{color:#5a4a90;}
.bets button:disabled span{color:#5a4a90;}
.ov,#toast{zoom:var(--u,1);}
#trackOut{width:100%;max-width:380px;height:90px;margin-top:8px;font-family:var(--fmono);font-size:9px;background:#0d0a1c;color:#b9b9c6;border:2px solid #4a3a90;border-radius:6px;padding:6px;}
#trackBtn.on{border-color:#ffd24a;color:#ffd24a;}
.grid4{flex-wrap:wrap;}
.grid4 .big-btn{flex:1 1 46%;}
.opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.heatinfo{font-family:var(--fmono);font-size:10px;letter-spacing:.08em;color:#ff9a2e;min-height:1.4em;margin-top:5px;}
#heatBtn{color:#ff9a2e;border-color:#ff9a2e;}
#codeIn{font-family:'Bungee','Bebas Neue',sans-serif;font-size:30px;letter-spacing:.12em;text-align:center;text-transform:uppercase;width:100%;max-width:300px;
  padding:10px 6px;border:3px solid #150f24;border-radius:6px;background:#0d0a1c;color:#ffd24a;box-shadow:5px 5px 0 #150f24;outline:none;margin-bottom:4px;}
#codeIn:focus{border-color:#ffd24a;}
#ovDress,#ovCode{background:#1a1238;z-index:6;}
#ovDress{justify-content:flex-start;padding-bottom:0;}
#dressList{width:100%;}
#dressInfo{flex:1;min-width:0;font-size:11px;line-height:1.4;color:#b9b9c6;}
#dressInfo b{display:block;font-family:var(--fdisp);font-weight:400;font-size:17px;letter-spacing:.06em;color:#fff;line-height:1.1;}
#dressInfo i{font-style:normal;color:#ffd24a;}

<body>

<div class="room">

</div>

<script src="game.js?v=1795835679"></script>
<script>
(function(){
  const D = DeadAir, $ = id => document.getElementById(id);
  const W = 540, H = 960;
  let N = D.N;                  // podiums on the strip right now; follows the game
  const cv = $('cv'); let ctx = cv.getContext('2d');
  if (!ctx.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
  const fmt = n => Math.floor(n).toLocaleString('en-US');
  const fx1 = n => (Math.round(n * 10) / 10).toString();
  const rnd = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const C = { cash: '#f5a542', gold: '#ffd24a', hype: '#42d4f5', dead: '#f542a8', jack: '#ff6bd6', spin: '#c8f542', lime: '#c8f542', box: '#9d8cff', bomb: '#ff5a3c', x2: '#ffffff', restock: '#d9a55a', car: '#ff5a7a', jp: '#ffd24a', clockp: '#7fe0ff', bleepp: '#7fe0ff', superstar: '#ffd24a', coin: '#ffd24a', broom: '#d9a55a' };

  // Where things are on the stage. The prize strip is a shallow arc.
  const PX = pos => 22 + pos * (496 / N);
  const PY = pos => 424 - 50 * Math.sin(Math.PI * pos / N);
  const RIG = [270, 110, 430, 190];        // x of each spotlight on the lighting rig
  const DESK = { x: 270, y: 706 };

  // ── Saved stats ────────────────────────────────────────────────
  const KEY = 'deadair.stats';
  let stats = { runs: 0, wins: 0, bestEp: 0, bestBank: 0, sound: true, who: 'rookie', money: 0, perks: {}, jackpot: 5000, unlocked: [], opened: 0, equip: {}, seen: {}, heat: 0, codes: {}, trophies: {}, gigs: 0 };
  try { Object.assign(stats, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const has = id => stats.unlocked.indexOf(id) >= 0;
  // Logbook: a gimmick or headliner is discovered the first time you get it, and stays discovered.
  function discover(id, lv) {
    if (!live) return;
    const e = stats.seen[id] || (stats.seen[id] = { n: 0, lv: 0 });
    e.n++; e.lv = Math.max(e.lv, lv || 1);
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch (e) {} };

  // ── Sound ──────────────────────────────────────────────────────
  let ac = null, live = false, lastNote = 0;
  const audio = () => { if (!stats.sound || !(live || crateShow)) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); return ac; } catch (e) { return null; } };
  function tone(freq, dur, type, vol, when, slide) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (when || 0), o = a.createOscillator(), v = a.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    v.gain.setValueAtTime(vol || 0.07, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(v).connect(a.destination); o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol, freq, q, swell) {
    const a = audio(); if (!a) return;
    const len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain(), t = a.currentTime;
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 0.7;
    if (swell) { v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + dur * 0.25); }
    else v.gain.setValueAtTime(vol, t);
    v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.buffer = buf; src.connect(f).connect(v).connect(a.destination); src.start();
  }
  const SCALE = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093];
  let combo = 0;
  const sfx = {
    buzz: () => { tone(150, 0.22, 'square', 0.09); tone(155, 0.22, 'sawtooth', 0.05); },
    win: () => { const now = performance.now(); if (now - lastNote < 30) return; lastNote = now; tone(SCALE[Math.min(SCALE.length - 1, combo++)], 0.16, 'triangle', 0.07); },
    hype: () => { tone(660, 0.1, 'square', 0.04); tone(990, 0.18, 'square', 0.04, 0.07); },
    perfect: () => [1047, 1319, 1568].forEach((f, i) => tone(f, 0.14, 'square', 0.04, i * 0.04)),
    zap: () => tone(1800, 0.09, 'sawtooth', 0.03, 0, 300),
    fire: () => { noise(0.4, 0.2, 500, 0.4, true); tone(140, 0.3, 'sine', 0.1, 0, 60); },
    laser: () => tone(300, 0.45, 'sawtooth', 0.045, 0, 2400),
    dead: () => { noise(0.5, 0.24, 2600, 0.4); tone(110, 0.45, 'sawtooth', 0.07, 0, 50); },
    chime: n => [523, 659, 784, 1047].slice(0, n).forEach((f, i) => tone(f, 0.18, 'triangle', 0.07, i * 0.06)),
    cheer: big => noise(big ? 1.6 : 0.8, big ? 0.16 : 0.09, 1500, 0.3, true),
    ooh: () => { tone(220, 0.6, 'sine', 0.07, 0, 150); noise(0.6, 0.05, 500, 0.5, true); },
    thump: () => noise(0.14, 0.2, 220, 0.8),
    toss: () => tone(300, 0.2, 'sine', 0.05, 0, 700),
    tick: f => tone(f, 0.05, 'square', 0.03),
    clack: () => { tone(900, 0.03, 'square', 0.05); noise(0.03, 0.08, 3000, 1); },
    fanfare: () => [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.045, i * 0.06)),
    trombone: () => [311, 294, 277, 196].forEach((f, i) => tone(f, i === 3 ? 0.6 : 0.26, 'sawtooth', 0.05, i * 0.26, i === 3 ? 150 : f * 0.97)),
  };

  // ── Canvas sizing ──────────────────────────────────────────────
  let scale = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    scale = Math.min(2.5, Math.max(0.5, r.width * (window.devicePixelRatio || 1) / W));
    cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
    // Menus are laid out for a stage about 400px wide; scale them with the stage so they fill it on any screen.
    document.documentElement.style.setProperty('--u', Math.min(2.2, Math.max(0.9, r.width / 400)).toFixed(3));
    buildCRT();
  }
  window.addEventListener('resize', resize);

  // ── House style: "Misprint" ────────────────────────────────────
  // Thick ink outlines that boil a few times a second, colour printed slightly off-register,
  // halftone dots instead of gradients, all seen through a CRT.
  const INK = '#150f24';
  let noGlow = false, inkSeq = 0;

  // Glows are halftone: a disc of dots that shrink toward the edge.
  const glows = {};
  // Bigger glows use a finer sheet, so the dots stay roughly the same size on screen.
  function glow(color, size) {
    const key = color + size;
    if (glows[key]) return glows[key];
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), h = size / 2; g.fillStyle = color;
    for (let y = 4; y < size; y += 8) for (let x = 4 + ((y >> 3) % 2) * 4; x < size; x += 8) {
      const d = Math.hypot(x - h, y - h) / h; if (d >= 1) continue;
      g.beginPath(); g.arc(x, y, 4.6 * Math.pow(1 - d, 0.75), 0, TAU); g.fill();
    }
    return (glows[key] = c);
  }
  function drawGlow(x, y, r, color, a) {
    if (noGlow) return;
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.max(0, Math.min(1, (a == null ? 1 : a) * 0.8));
    ctx.drawImage(glow(color, r <= 44 ? 128 : r <= 110 ? 256 : 512), x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  // Deterministic wobble: the same shape gets the same jitter until the next "boil" frame.
  function jit(k) { const h = Math.sin(inkSeq * 12.9898 + Math.floor(time * 7) * 78.233 + k * 37.719) * 43758.5453; return h - Math.floor(h) - 0.5; }
  // Fill a shape off-register, then outline it in wobbly ink. fn adds subpaths (no beginPath).
  function ink(fn, fill, lw) {
    inkSeq++;
    if (fill) { ctx.save(); ctx.translate(1.6, 1.6); ctx.fillStyle = fill; ctx.beginPath(); fn(); ctx.fill(); ctx.restore(); }
    ctx.strokeStyle = INK; ctx.lineWidth = lw || 2.8; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.save(); ctx.translate(jit(1) * 1.3, jit(2) * 1.3); ctx.beginPath(); fn(); ctx.stroke(); ctx.restore();
  }
  // An outlined arm or leg.
  function limb(x1, y1, x2, y2, col, w) {
    inkSeq++; const jx = jit(1) * 1.2, jy = jit(2) * 1.2; ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = w + 5; ctx.beginPath(); ctx.moveTo(x1 + jx, y1 + jy); ctx.lineTo(x2 + jx, y2 + jy); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1 + 1, y1 + 1); ctx.lineTo(x2 + 1, y2 + 1); ctx.stroke();
  }

  // Stickers: any small drawing, turned into three boil frames with an ink outline,
  // halftone shading and off-register colour. Built once, then just stamped.

        const x = podX(ev.i), y = podY(ev.i) - 16;
        bolt(x + rnd(-60, 60), 126, x, y, '#f542a8'); staticBurst(x, y, 14); podFx[ev.i] = 0;
        float(x, y - 26, 'INTERFERENCE', C.dead, 15); glitch = Math.max(glitch, 0.18); shake = Math.max(shake, 3);
        noise(0.18, 0.12, 2600, 0.5);
        break;
      }
      case 'timeup': shout("TIME'S UP!", '#ffd24a', 60, 1.2); sfx.buzz(); tone(880, 0.5, 'square', 0.06, 0, 220); shake = Math.max(shake, 6); break;
      case 'shift': shiftAnim = 1; sfx.tick(240); break;
      case 'slow': slowFx = 1; tone(500, 0.6, 'sine', 0.07, 0, 120); break;
      case 'whiff': float(podX(ev.i), podY(ev.i) - 40, 'NOTHING THERE', '#e9e9ff', 18); tone(200, 0.2, 'sine', 0.05, 0, 120); break;
      case 'midas': { const x = podX(ev.i), y = podY(ev.i) - 16; podFx[ev.i] = 0; spark(x, y, C.gold, 14, 200, 0.6, 3); float(x, y - 24, 'GOLD!', C.gold, 17); sfx.tick(1500); break; }
      case 'rerun':
        staticBurst(podX(ev.i), podY(ev.i) - 16, 30); glitch = 0.5; shake = 8; flashA = 0.3; flashC = C.dead;
        shout('RERUN! HALF THE CASH', '#ff5a7a', 46, 1.4); sfx.dead(); sfx.cheer(false);
        break;
      case 'coin':
        coin = { up: ev.up, t: 0 }; for (let k = 0; k < 8; k++) sfx.tick(600 + k * 90);
        break;
      case 'ray': rays.push({ i: ev.i, life: 0.3, max: 0.3 }); ballFlash = 1; sfx.tick(1600); break;
      case 'bolt': bolt(podX(ev.a), podY(ev.a) - 18, podX(ev.b), podY(ev.b) - 18, '#fff36b'); sfx.zap(); break;
      case 'pyro':
        [ev.a, ev.b].forEach(i => { if (i >= 0 && i < N) jets.push({ i, life: 0.5, max: 0.5 }); });
        shake = Math.max(shake, 6); flashA = Math.max(flashA, 0.12); flashC = '#ff9a2e'; sfx.fire(); excite += 0.2;
        break;
      case 'laser': lasers.push({ fromLeft: ev.fromLeft, n: ev.n, t: 0 }); sfx.laser(); excite += 0.15; break;
      case 'zap': droneGo[ev.k] = { i: ev.i, t: 0 }; bolt(podX(ev.i), 300, podX(ev.i), podY(ev.i) - 20, '#9d8cff'); sfx.zap(); break;
      case 'cannon': {
        const s = ev.left ? 0 : 1; cannonFx[s] = 1;
        const x0 = DESK.x + (s ? 150 : -150), y0 = 690;
        shots.push({ x0, y0, x1: podX(ev.i), y1: podY(ev.i) - 16, t: 0 });
        spark(x0, y0 - 20, '#d8d8e0', 8, 160, 0.5, 4); sfx.thump(); shake = Math.max(shake, 3);
        break;
      }
      case 'toss': tosses.push({ i: ev.i, x0: rnd(60, 480), t: 0 }); sfx.toss(); podFx[ev.i] = -0.32; break;
      case 'bleep': {
        const x = podX(ev.i), y = podY(ev.i) - 16;
        rings.push({ x, y, r: 8, to: 60, life: 0.35, max: 0.35, color: '#7fe0ff', w: 6 });
        staticBurst(x, y, 16); float(x, y - 26, ev.lucky ? (G.tr('rookie') && G.luckUsed && !G.lv('lucky') ? "BEGINNER'S LUCK!" : 'LUCKY!') : ev.prize ? 'BLEEP! +100' : 'BLEEP!', ev.lucky ? '#ff6bd6' : '#7fe0ff', 26); if (ev.prize) podFx[ev.i] = 0; tone(1000, 0.3, 'sine', 0.09); shake = Math.max(shake, 4);
        break;
      }
      case 'bust':
        if (live && ev.lost > 0) { stats.jackpot = (stats.jackpot || 5000) + Math.round(ev.lost * 0.1); save(); }   // busted pots feed the jackpot
        staticBurst(podX(ev.i), podY(ev.i) - 16, 40); shake = 14; flashA = 0.4; flashC = C.dead; glitch = 0.9; dark = 1; excite = 0;
        shout('DEAD AIR', C.dead, 90, 1.4); sfx.dead(); sfx.ooh();
        break;
      case 'refill':
        for (let i = 0; i < N; i++) podFx[i] = -i * 0.03;
        if (ev.bonus) { shout('STAGE CLEARED! +2 HYPE', '#fff', 44, 1.3); flashA = 0.3; flashC = '#fff'; confetti(W / 2, 300, 70, 220, 300); sfx.cheer(true); sfx.fanfare(); excite = 1.6; }
        break;
      case 'round': for (let i = 0; i < N; i++) podFx[i] = -0.1 - i * 0.04; dark = 0;
        if (G.voteKind && live) setTimeout(() => { if (G && G.voteKind) { shout('THE CROWD WANTS ' + G.voteKind.toUpperCase() + '!', '#f5a542', 46, 1.3); sfx.cheer(false); excite = 1; } }, G.roundsLeft === G.rounds ? 4200 : 300);
        break;
      case 'roundEnd':
        coin = null;
        tally = { ...ev, t: 0, done: false };
        if (!ev.bust) { sfx.chime(4); if (ev.score >= G.target(G.ep) * 0.4) { sfx.cheer(true); excite = 1.5; confetti(W / 2, 200, 60, 240, 200); } }
        break;
    }
  }

  // ── Flow ───────────────────────────────────────────────────────
  function afterTally() {
    G.next();
    if (!live) { if (G.phase === 'ask') G.answer(false); else if (G.phase !== 'sweep') startDemo(); return; }
    trackAfter();
    if (G.best > stats.bestBank) stats.bestBank = G.best;
    if (G.best >= 100000) trophy('bank100k'); if (G.best >= 1000000) trophy('bank1m');
    if (G.last && G.last.score > 0 && !G.endless) {      // endless is for glory: no prize money
      const pay = Math.round(G.last.score * (1 + 0.2 * (stats.perks.agent || 0)) * (1 + D.HEAT_PAY * G.heat) * (G.tr('intern') ? 0.5 : 1) * (G.lv('charity') ? 1.5 : 1) * (G.ch('agent') ? 1.15 : 1));
      stats.money = (stats.money || 0) + pay; runMoney += pay;
    }
    if (G.wagerResult) {
      const w = G.wagerResult; G.wagerResult = null;
      const gain = (D.WAGER_PAYS - 1) * w.stake;
      if (w.won) { stats.money += D.WAGER_PAYS * w.stake; runMoney += gain; trophy('bet'); }
      setTimeout(() => { if (!G || !live) return; float(DESK.x, DESK.y - 150, w.won ? 'SIDE BET WON +$' + fmt(gain) : 'SIDE BET LOST -$' + fmt(w.stake), w.won ? C.gold : '#8a8aa0', 26); if (w.won) sfx.fanfare(); else sfx.trombone(); }, 700);
    }
    save();
    if (G.phase === 'cleared' || G.phase === 'won') onCleared();
    else if (G.phase === 'over') {
      stats.bestEp = Math.max(stats.bestEp, G.ep - 1); save();
      glitch = 1.2; dark = 1; sfx.dead();
      setTimeout(() => { if (G && live) showEnd(false); }, 1200);
    } else if (G.phase === 'ask') showAsk();
    else if (G.bonus) {
      shout('EPISODE CLEARED!', C.lime, 56, 1.2); sfx.cheer(true); excite = 1.6;
      showCard({ icon: 'e_bonus', kick: 'BONUS ROUND', title: 'ONE BUZZ', text: 'Hit a wheel token: +1 spin.', color: '#ffd24a', yes: "LET'S GO" });
    }
    syncPads();
  }

  function onCleared() {
    stats.bestEp = Math.max(stats.bestEp, G.ep);
    if (G.phase === 'won') { stats.wins++; if (!G.code) stats.heatBest = Math.max(stats.heatBest, G.heat); if (G.episodes === D.EPISODES) { stats.lastTime = Math.round(G.elapsed); stats.bestTime = Math.min(stats.bestTime || 1e9, stats.lastTime); } }
    save();
    if (G.boss) trophy('b_' + G.boss.id);
    if (G.endless && G.ep >= 20) trophy('ep20');
    if (G.phase === 'won') {
      trophy('win'); if (G.heat >= 1) trophy('heat1'); if (G.heat >= 5) trophy('heat5'); if (G.heat >= 10) trophy('heat10');
      if (G.episodes === D.EPISODES && G.elapsed < 900) trophy('fast');
      if (G.code && /^D\d{8}$/.test(G.code)) trophy('daily');
    }
    shout(G.phase === 'won' ? 'SEASON WRAPPED!' : 'EPISODE CLEARED!', C.lime, 60, 1.6);
    for (let i = 0; i < 4; i++) confetti(rnd(60, 480), 160, 45, 60, 260);
    sfx.cheer(true); sfx.fanfare(); excite = 1.6;
    const won = G.phase === 'won';
    setTimeout(() => {
      if (!G || !live) return;
      const go = () => { won ? showEnd(true) : showLoad(); };
      const h = G.booked; G.booked = null;
      if (!h) return go();
      // Clearing an act finale: the network books a headliner for you.
      discover(h.id, 1); save(); badgeFx.set(h.id, 0); sfx.fanfare(); sfx.cheer(true);
      showCard({ icon: h.id, kick: 'HEADLINER BOOKED', title: h.name, text: h.d(1), color: h.color, yes: 'OK', onYes: go });
    }, 1700);
  }

  // One card, one thing to read. The show waits until it is answered.
  function showCard(o) {
    $('cardKick').textContent = o.kick || 'TONIGHT ONLY';
    $('cardIcon').src = iconURL(o.icon);
    $('cardTitle').textContent = o.title; $('cardTitle').style.color = o.color || '';
    if (o.html) $('cardText').innerHTML = o.html; else $('cardText').textContent = o.text;
    $('cardYes').textContent = o.yes; $('cardNo').textContent = o.no || ''; $('cardNo').hidden = !o.no;
    const close = fn => () => { $('ovCard').hidden = true; pausedUI = false; if (fn) fn(); syncPads(); };
    $('cardYes').onclick = close(o.onYes); $('cardNo').onclick = close(o.onNo);
    $('ovCard').hidden = false; pausedUI = true;
  }
  function showAsk() {
    const a = G.ask;
    if (a.type === 'offer') showCard({ icon: 'e_offer', kick: "THE HOST'S OFFER", title: '$' + fmt(a.amount) + ' TO SIT OUT', color: '#c8f542',
      text: fmt(Math.max(0, G.target(G.ep) - G.total)) + ' TO GO · ' + G.roundsLeft + ' ROUND' + (G.roundsLeft === 1 ? '' : 'S') + ' LEFT',
      yes: 'TAKE THE MONEY', no: 'PLAY ON', onYes: () => { G.answer(true); sfx.chime(4); }, onNo: () => G.answer(false) });
    else showCard({ icon: 'e_ad', kick: 'COMMERCIAL BREAK', title: a.deal.name, color: '#42d4f5', text: a.deal.desc,
      yes: 'SIGN THE DEAL', no: 'NO THANKS', onYes: () => { G.answer(true); sfx.fanfare(); }, onNo: () => G.answer(false) });
  }

  function syncPads() {
    const stage = live && G && (G.phase === 'sweep' || G.phase === 'resolve' || G.phase === 'tally');
    const wheel = live && G && G.phase === 'wheel';
    $('padStage').hidden = !stage; $('padWheel').hidden = !wheel; $('result').hidden = !wheel;
    if (wheel) $('spin').textContent = G.spins > 0 ? 'SPIN  ×' + G.spins : 'GO ON AIR';
  }

  // ── Wheel screen ───────────────────────────────────────────────
  let wheelA = 0, spinAnim = null, lastWedge = -1, pointerKick = 0, wedgeFx = -1, wedgeFxT = 0;
  function showLoad() {
    G.openWheel();
    saveRun('wheel');
    const earned = (G.earned || []).map(e => `${e[0]} +${e[1]}`).join(' · ');
    $('loadSub').innerHTML = `<b style="color:#ffd24a">${G.spins} SPIN${G.spins === 1 ? '' : 'S'}</b> · ADD ONE TO THE WHEEL`;
    $('offerList').innerHTML = G.offers.map((o, i) => {
      const d = o.def, lv = o.type === 'g' ? G.lv(d.id) : 0;
      return `<button class="card${d.rare ? ' rare' : ''}" data-offer="${i}" style="--c:${d.color}">
        <img alt="" src="${iconURL(o.type === 'g' ? d.id : d.id === 'gold' ? 'goldwedge' : d.id)}"><span class="k">${d.rare ? 'HEADLINER' : o.type === 'g' ? 'NEW WEDGE' : 'WHEEL UPGRADE'}</span>
        <b>${d.name}</b><p>${o.type === 'g' ? d.d(Math.min(d.max, lv + 1)) : d.desc}</p></button>`;
    }).join('');
    $('ovLoad').hidden = false; $('result').hidden = true;
    syncPads();
  }
  $('offerList').addEventListener('click', e => {
    const b = e.target.closest('[data-offer]'); if (!b) return;
    const r = G.takeOffer(+b.dataset.offer); if (!r) return;
    if (trkEp) trkEp.offer = r.offer.def.id;
    $('ovLoad').hidden = true;
    if (r.at >= 0) { wedgeFx = r.at; wedgeFxT = 0; }
    sfx.fanfare();
    $('result').innerHTML = `<b>${r.offer.def.name}</b>`;
    syncPads();
  });

  const EXTRA = { rival: 'RIVAL · +1 SPIN', vote: 'AUDIENCE VOTE', offer: "HOST'S OFFER", ad: 'SPONSOR DEAL', bonus: 'BONUS ROUND', event: 'BACKSTAGE' };
  function showPick() {
    const ep = G.ep + 1;
    $('pickSub').textContent = 'EPISODE ' + ep + ' · TARGET ' + fmt(G.target(ep));
    $('pickList').className = 'cards three';
    $('pickList').innerHTML = G.choices.map((n, i) => {
      const f = D.byId(D.FORMATS, n.format), ok = G.canReach(i);
      return `<button class="card" data-format="${i}" style="--c:${f.color}" ${ok ? '' : 'disabled'}>
        <img alt="" src="${iconURL('f_' + f.id)}"><b>${f.name}</b><p>${f.desc}</p>
        ${f.spins ? '<span class="plus">+' + f.spins + ' SPIN</span>' : ''}
        ${n.extra ? `<span class="extra"><img alt="" src="${iconURL('e_' + n.extra)}">${EXTRA[n.extra]}</span>` : ''}</button>`;
    }).join('') ;
    paintBet();
    $('ovPick').hidden = false; $('result').hidden = true; $('padWheel').hidden = true;
  }
  function paintBet() {
    const can = !G.code && !G.endless && G.ep < G.episodes;
    if (!can || pickStake > (stats.money || 0)) pickStake = 0;
    $('betBox').hidden = !can;
    const k = v => v >= 1e6 ? '$' + v / 1e6 + 'M' : '$' + v / 1000 + 'K';
    $('pickBet').innerHTML = D.WAGERS.map(w => {
      const poor = w > (stats.money || 0);
      return `<button data-bet="${w}" class="${pickStake === w ? 'on' : ''}" ${poor ? 'disabled' : ''}>${w ? `<b>${k(w)}</b><span>${poor ? "CAN'T AFFORD" : 'WINS ' + k(w * D.WAGER_PAYS)}</span>` : '<b>NO BET</b><span>&nbsp;</span>'}</button>`;
    }).join('');
  }
  $('pickBet').addEventListener('click', e => { const b = e.target.closest('[data-bet]'); if (b && !b.disabled) { pickStake = +b.dataset.bet; paintBet(); } });
  // After a booking (and anything backstage), either spend spins or go on air.
  function afterBooking() {
    if (G.phase === 'event') return showEvent();
    if (G.phase === 'wheel' && G.spins > 0) { $('result').hidden = false; $('result').innerHTML = `<b>${G.spins} SPIN${G.spins === 1 ? '' : 'S'}</b>`; syncPads(); return; }
    if (G.phase === 'wheel') G.wheelDone();
    beginEpisode();
  }
  function showEvent() {
    const ev = G.event;
    showCard({ icon: 'e_event', kick: 'BACKSTAGE', title: ev.name, color: '#ffd24a', html: '1 · ' + ev.a[0] + '<br>2 · ' + ev.b[0], yes: 'OPTION 1', no: 'OPTION 2',
      onYes: () => resolveEvent(true), onNo: () => resolveEvent(false) });
  }
  function resolveEvent(a) {
    if (trkEp) trkEp.event = G.event.id + (a ? ':a' : ':b');
    const r = G.answerEvent(a);
    if (r && r.got) { discover(r.got.id, G.lv(r.got.id)); save(); badgeFx.set(r.got.id, 0); shout(r.got.name + '!', r.got.color, 50, 1.4); }
    sfx.chime(3);
    afterBooking();
  }
  $('pickList').addEventListener('click', e => {
    const b = e.target.closest('[data-format]'); if (!b || b.disabled) return;
    if (!G.pickFormat(+b.dataset.format)) return;
    if (trkEp) trkEp.pick = G.lane + ':' + G.nextFormat + (G.nextSpecial ? '+' + G.nextSpecial : G.phase === 'event' ? '+event' : ''); trackSave();
    if (pickStake && G.setWager(pickStake)) { stats.money -= pickStake; save(); }
    $('ovPick').hidden = true; sfx.chime(3);
    afterBooking();
  });

  function wedgeSpans() {
    const tot = G.wheelTotal(); let a = 0;
    return G.wheel.map(w => { const s = { a0: a, a1: a + w.w / tot * TAU, w }; a = s.a1; return s; });
  }
  function doSpin() {
    if (spinAnim) return;
    if (G.spins <= 0) { if (G.wheelDone()) { if (G.phase === 'pick') showPick(); else beginEpisode(); } return; }
    const spans = wedgeSpans(), res = G.spin(); if (!res) return;
    const s = spans[res.index], mid = s.a0 + (s.a1 - s.a0) * res.frac;
    const base = -Math.PI / 2 - mid;
    const to = base + Math.ceil((wheelA + 4.5 * TAU - base) / TAU) * TAU;
    spinAnim = { from: wheelA, to, t: 0, dur: 4.4, res };
    $('result').innerHTML = ''; $('spin').disabled = true; $('spin').textContent = '…';
    tone(200, 0.5, 'sawtooth', 0.04, 0, 900);
  }
  function landSpin(res) {
    $('spin').disabled = false;
    wedgeFx = res.index; wedgeFxT = 0;
    if (trkEp) { trkEp.spins.push(res.got.length ? res.got.map(x => x.id).join('+') : res.type); trackSave(); }
    if (res.got.length) {
      res.got.forEach(g => { badgeFx.set(g.id, 0); discover(g.id, G.lv(g.id)); }); save();
      const g = res.got[0];
      shout(g.name + '!', g.color, 54, 1.6); sfx.fanfare(); sfx.cheer(true); excite = 1.6;
      for (let i = 0; i < 3; i++) confetti(rnd(100, 440), 250, 40, 60, 300);
      $('result').innerHTML = res.got.map(g => `<b style="color:${g.color}">${g.name} · LEVEL ${G.lv(g.id)}</b><span>${g.d(G.lv(g.id))}</span>`).join('') +
        '';
    } else if (res.type === 'junk') {
      shout('A TOASTER.', '#8a8aa0', 54, 1.4); sfx.trombone(); excite = 0.2;
      $('result').innerHTML = `<b>A TOASTER</b><span>+$10 starting pot</span>`;
    } else if (res.type === 'dead') {
      shout('DEAD AIR', C.dead, 80, 1.3); sfx.dead(); glitch = 0.7; excite = 0;
      $('result').innerHTML = `<b style="color:#f542a8">DEAD AIR</b>`;
    } else $('result').innerHTML = `<b>EVERYTHING IS MAXED</b>`;
    syncPads();
  }

  function codeResult(won) {
    if (!G.code) return '';
    const eps = won ? Math.max(G.episodes, G.ep) : G.ep - 1, banked = G.banked || 0, old = stats.codes[G.code];
    if (!old || eps > old.eps || (eps === old.eps && banked > old.banked)) { stats.codes[G.code] = { eps, banked }; save(); }
    const line = 'DEAD//AIR ' + G.code + ' · CLEARED ' + eps + ' · BANKED ' + fmt(banked);
    setTimeout(() => { const c = $('copyRes'); if (c) c.onclick = () => { const done = () => { c.textContent = 'COPIED'; }; try { navigator.clipboard.writeText(line).then(done, () => { c.textContent = line; }); } catch (e) { c.textContent = line; } }; }, 0);
    return `<div class="row"><span>CODE</span><b style="color:#ffd24a">${G.code}</b></div><div class="row"><span>RESULT</span><b>CLEARED ${eps} · ${fmt(banked)}</b></div>`;
  }
  function buildRow() {
    return '<div class="build">' + D.GIMMICKS.filter(x => G.lv(x.id)).map(x => `<span><img alt="${x.name}" src="${iconURL(x.id)}"><i class="${G.evo[x.id] ? 'evo' : ''}">${G.evo[x.id] ? '★' : G.lv(x.id)}</i></span>`).join('') + '</div>';
  }
  function logRun(won) {
    if (G._logged) return; G._logged = true;
    stats.history = [{ who: G.who, ep: won ? G.episodes : G.ep - 1, of: G.episodes, won, heat: G.heat, t: Math.round(G.elapsed), code: G.code || '' }].concat(stats.history || []).slice(0, 12);
    if (won && !G.code && G.episodes === D.EPISODES) {
      stats.marks[G.who] = Math.max(stats.marks[G.who] || 0, G.heat + 1);
      if (Object.keys(stats.marks).length >= 4) trophy('cast');
    }
    save();
  }
  function showEnd(won) {
    logRun(won); trackEnd(won);
    const kit = Object.values(G.levels).reduce((a, b) => a + b, 0);
    $('ovEnd').innerHTML = won
      ? `<h1>SEASON WRAPPED</h1>${buildRow()}
         <div class="rows"><div class="row"><span>BIGGEST BANK</span><b>${fmt(G.best)}</b></div><div class="row"><span>GIMMICK LEVELS</span><b>${kit}</b></div><div class="row"><span>RUN TIME</span><b>${clockText(G.elapsed)}</b></div>${codeResult(true)}<div class="row"><span>PRIZE MONEY BANKED</span><b style="color:#ffd24a">+$${fmt(runMoney)}</b></div></div>
         <button class="big-btn" id="endA">PLAY ON FOR FUN</button><button class="big-btn alt" id="endB">FINISH</button>`
      : `<h1 class="bad">CANCELLED</h1><p class="sub">EPISODE ${G.ep} · ${fmt(G.total)} / ${fmt(G.target(G.ep))}</p>${buildRow()}
         <div class="rows"><div class="row"><span>EPISODES CLEARED</span><b>${G.ep - 1}</b></div><div class="row"><span>BIGGEST BANK</span><b>${fmt(G.best)}</b></div><div class="row"><span>GIMMICK LEVELS</span><b>${kit}</b></div><div class="row"><span>RUN TIME</span><b>${clockText(G.elapsed)}</b></div>${codeResult(false)}<div class="row"><span>PRIZE MONEY EARNED</span><b style="color:#ffd24a">+$${fmt(runMoney)}</b></div></div>
         <button class="big-btn" id="endA">NEW RUN</button><button class="big-btn alt" id="endB">BACK TO TITLE</button>`;
    if (G.code) $('ovEnd').insertAdjacentHTML('beforeend', '<button class="hdr-btn" id="copyRes" style="margin-top:12px">COPY RESULT</button>');
    $('ovEnd').hidden = false; syncPads();
    $('endA').onclick = () => { $('ovEnd').hidden = true; won ? showLoad() : newRun(); };
    $('endB').onclick = () => { clearRun(); toTitle(); };
    if (!won) clearRun();
  }

  function resetFx() {
    parts = []; bolts = []; rings = []; floats = []; flyers = []; rays = []; jets = []; tosses = []; shots = []; lasers = [];
    tally = null; callout = null; shake = 0; glitch = 0; flashA = 0; dark = 0; spinAnim = null; droneGo.length = 0;
  }
  function beginEpisode() {
    saveRun('episode');
    G.startEpisode();

  function drawBackdrop() {
    const ex = Math.min(1, excite);

    drawGlow(cx, cy, 280, '#7a5ae0', 0.22 + ex * 0.3);
    // flat colour washes from the rig

    for (let i = 0; i < 4; i++) {

      const x1 = x0 + Math.sin(a) * 620, y1 = 116 + Math.cos(a) * 620;

    ctx.strokeStyle = 'rgba(21,15,36,.55)'; ctx.lineWidth = 2;
    for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 30, 442); ctx.lineTo(W / 2 + i * 95, 850); ctx.stroke(); }

  function drawStrip() {
    const beams = G.beams(), hidden = G.is('mystery'), ghost = G.lv('ghost') > 0;

      const p = G.strip[i]; if (!p) continue;

      const danger = p.state === 'up' && p.kind === 'dead', burnt = p.state === 'burnt';
      // On MYSTERY NIGHT you only see what a light is passing over.
      const covered = hidden && p.state === 'up' && !beams.some(b => Math.abs(b - i - 0.5) < 1.45) && G.phase !== 'tally';
      // pedestal (everything shrinks a little when BIGGER STAGE adds podiums)
      const K = Math.min(1, 12 / N);
      ctx.save(); ctx.translate(x, y); ctx.scale(K, K); ctx.translate(-x, -y);
      inkSeq = 2000 + i * 3;
      ink(() => { ctx.moveTo(x - 17, y); ctx.lineTo(x + 17, y); ctx.lineTo(x + 14, y + 52); ctx.lineTo(x - 14, y + 52); ctx.closePath(); }, '#3d2e86', 2.6);

      ctx.globalAlpha = burnt ? 0.5 : 1; ctx.fillRect(x - 15, y + 10, 31, 7); ctx.globalAlpha = 1;
      ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.strokeRect(x - 15, y + 10, 31, 7);
      ink(() => ctx.ellipse(x, y, 17, 5.5, 0, 0, TAU), '#6a55c8', 2.4);
      ctx.restore();

      const pop = f < 0.25 ? 1 + (1 - f / 0.25) * 0.5 : 1;

  // ── Drawing: lights and gimmicks on the set ────────────────────

    // the crowd

      if (ex > 0.6) { ctx.beginPath(); ctx.arc(x, y + 3, 3, 0, Math.PI); ctx.fill(); }
    });
    if (ex > 0.8 && Math.random() < 0.35) { const c = crowd[(Math.random() * crowd.length) | 0]; drawGlow(c.x + rnd(-8, 8), c.y - 4, rnd(18, 34), '#ffffff', 0.9); }

  // ── Drawing: effects ───────────────────────────────────────────
  function drawFx(dt) {
    rings = rings.filter(r => r.life > 0);
    for (const r of rings) {
      r.life -= dt; const k = 1 - r.life / r.max;
      ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r + (r.to - r.r) * k, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
    bolts = bolts.filter(b => b.life > 0);
    ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round';
    for (const b of bolts) {
      b.life -= dt; const a = Math.max(0, b.life / b.max);
      for (const [w, c] of [[10, b.color], [3, '#ffffff']]) {
        ctx.globalAlpha = a * (w > 4 ? 0.55 : 1); ctx.strokeStyle = c; ctx.lineWidth = w;
        ctx.beginPath(); b.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // prizes flying to the pot
    flyers = flyers.filter(f => f.t < f.dur);
    for (const f of flyers) {
      f.t += dt; const k = Math.min(1, f.t / f.dur), e = k * k;
      const x = f.x0 + (DESK.x + 70 - f.x0) * e, y = f.y0 + (DESK.y + 20 - f.y0) * e - Math.sin(k * Math.PI) * 60;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1; ctx.drawImage(glow(f.color, 128), x - 20, y - 20, 40, 40);
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 3, y - 3, 6, 6);
      if (Math.random() < 0.8) parts.push({ x, y, vx: rnd(-20, 20), vy: rnd(-20, 20), life: 0.3, max: 0.3, color: f.color, size: 3, g: 0, k: 'spark' });
      if (k >= 1) { deskBump = 1; spark(DESK.x + 70, DESK.y + 20, f.color, 5, 120, 0.3); }
    }
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.k === 'spark') { ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.6)); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const p of parts) {
      if (p.k === 'spark') continue;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 2)); ctx.fillStyle = p.color;
      if (p.k === 'conf') { p.rot += p.vr * dt; p.vx *= 0.985; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4 * Math.cos(p.rot * 2), p.size, p.size / 2); ctx.restore(); }
      else ctx.fillRect(p.x, p.y, p.size * 1.6, 2);
    }
    ctx.globalAlpha = 1;
    floats = floats.filter(f => f.life > 0);
    ctx.textBaseline = 'middle';
    for (const f of floats) {
      f.life -= dt; f.y -= 44 * dt;
      const k = f.life / f.max;
      ctx.globalAlpha = Math.min(1, k * 2.5); font(f.size * (1 + Math.max(0, k - 0.8) * 2));
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(7,7,10,.85)'; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.strokeText(f.text, f.x, f.y);
      text(f.text, f.x, f.y, f.color, 'center');
    }
    ctx.globalAlpha = 1;
  }

  function drawCallout(dt) {
    if (!callout) return;
    callout.t += dt;
    const c = callout, k = c.t / c.hold;
    if (k >= 1) { callout = null; return; }
    const s = k < 0.15 ? 0.4 + (k / 0.15) * 0.75 : k < 0.25 ? 1.15 - (k - 0.15) / 0.1 * 0.15 : 1;
    ctx.save(); ctx.translate(W / 2, 250); ctx.rotate(-0.06); ctx.scale(s, s); ctx.globalAlpha = k > 0.8 ? 1 - (k - 0.8) / 0.2 : 1;
    ctx.font = (c.size * 0.74) + "px 'Bungee','Bebas Neue',sans-serif";
    const w = ctx.measureText(c.text).width;
    if (w > W - 50) ctx.scale((W - 50) / w, (W - 50) / w);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 13; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText(c.text, 0, 0); ctx.strokeText(c.text, 5, 5);
    ctx.fillStyle = '#f542a8'; ctx.fillText(c.text, 5, 5);
    ctx.fillStyle = c.color; ctx.fillText(c.text, 0, 0);
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawTally(dt) {
    if (!tally) return;
    const T = tally; T.t += dt;
    if (T.bust && !T.score) { if (T.t > 1.3 && !T.done) { T.done = true; tally = null; afterTally(); } return; }
    const steps = [0.0, 0.3, 0.6], end = 1.9;
    ctx.fillStyle = 'rgba(7,7,10,.86)'; ctx.strokeStyle = T.bust ? C.dead : C.lime; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(60, 470, 420, 150, 8); ctx.fill(); ctx.stroke();
    ctx.textBaseline = 'middle';
    const cell = (i, label, val, col, x) => {
      if (T.t < steps[i]) return;
      const pop = Math.max(0, 1 - (T.t - steps[i]) / 0.15);
      if (pop > 0.9 && !T['s' + i]) { T['s' + i] = true; sfx.tick(500 + i * 160); }
      font(11, 'mono'); text(label, x, 494, '#8a8aa0', 'center');
      font(34 * (1 + pop * 0.4)); text(val, x, 524, col, 'center');
    };
    cell(0, 'CASH', fmt(T.cash), C.cash, 150);
    cell(1, T.xm > 1 ? 'HYPE × DIAMOND' : 'HYPE', '×' + fx1(T.hype * T.xm), T.xm > 1 ? C.jack : C.hype, 390);
    if (T.t >= steps[2]) {
      const k = Math.min(1, (T.t - steps[2]) / 0.6), v = T.score * (1 - Math.pow(1 - k, 3));
      if (k < 1 && Math.random() < 0.5) sfx.tick(700 + k * 900);
      if (k >= 1 && !T.boomed) { T.boomed = true; if (!T.bust) confetti(W / 2, 580, 30, 150, 420); }
      font(56); text(fmt(v), W / 2, 580, T.bust ? C.dead : C.lime, 'center');
      if (T.bust) { font(11, 'mono'); text('SAFETY NET', W / 2, 610, '#42f5b0', 'center'); }
    }
    if (T.t > end && !T.done) { T.done = true; tally = null; afterTally(); }
  }

  function drawGlitch() {
    if (glitch <= 0) return;
    for (let i = 0; i < 7; i++) {
      const y = Math.random() * cv.height, h = 6 + Math.random() * 40 * scale, off = (Math.random() - 0.5) * 60 * scale * Math.min(1, glitch * 2);

    for (let y = (time * 300) % 6; y < H; y += 6) ctx.fillRect(0, y, W, 2);
  }

    ctx.strokeStyle = '#34344a'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(0, 0, R + 3, 0, TAU); ctx.stroke();
    const nb = 32, stepB = Math.floor(time * 8);
    for (let i = 0; i < nb; i++) { const a = i / nb * TAU, on = (i + stepB) % 2 === 0; ctx.fillStyle = on ? '#ffe9a0' : '#5a4a20'; ctx.beginPath(); ctx.arc(Math.cos(a) * (R + 3), Math.sin(a) * (R + 3), 3, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#1c1c30'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    font(14); ctx.textBaseline = 'middle'; text('SPIN', cx, cy + 1, '#ffd24a', 'center');
    // pointer
    pointerKick = Math.max(0, pointerKick - dt * 9);
    ctx.save(); ctx.translate(cx, cy - R - 12); ctx.rotate(-pointerKick * 0.5);
    drawGlow(0, 6, 30, '#e8203a', 0.7);
    ctx.fillStyle = '#e8203a'; ctx.beginPath(); ctx.moveTo(-15, -14); ctx.lineTo(15, -14); ctx.lineTo(0, 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -6, 4, 0, TAU); ctx.fill();
    ctx.restore();
    // header
    ctx.textBaseline = 'middle';
    font(40); text('THE PRIZE WHEEL', cx, 46, '#ffd24a', 'center');
    font(12, 'mono'); text(G.spins + ' SPIN' + (G.spins === 1 ? '' : 'S') + ' LEFT  ·  NEXT: EPISODE ' + (G.ep + 1) + '  ·  TARGET ' + fmt(G.target(G.ep + 1)), cx, 80, '#d8d8e0', 'center');
    drawBadges(100);
  }

  // ── Main loop ──────────────────────────────────────────────────
  const DT = 1 / 120;
  let prev = performance.now(), acc = 0, demoT = 1;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    if (!G) return;
    time += dt;
    N = G.n || D.N;
    if (crateShow) { drawCrateShow(dt); return; }
    if (live) G.elapsed = (G.elapsed || 0) + dt;
    const onWheel = G.phase === 'load' || G.phase === 'wheel' || G.phase === 'pick' || G.phase === 'ready';
    if (live && G.toasters >= 5 && !G._club) { G._club = true; trophy('toast'); toast('junk', '<b>BREAKFAST CLUB</b>TOASTERS NOW $50 EACH'); }
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
    else if (toasts.length) { const t = toasts.shift(); $('toastPic').src = iconURL(t[0]); $('toastText').innerHTML = t[1]; $('toast').hidden = false; toastT = 2.6; }
    if (live && G.newEvos && G.newEvos.length && !pausedUI && !spinAnim && $('ovCard').hidden && G.newEvos[0].set) {
      const st = G.newEvos.shift();
      sfx.fanfare(); sfx.cheer(true); excite = 1.4; trophy('set');
      for (let k = 0; k < 2; k++) confetti(rnd(80, 460), 220, 45, 60, 300);
      showCard({ icon: st.of.find(id => G.lv(id)), kick: 'SET COMPLETE', title: st.name, text: st.desc, color: st.color, yes: 'OK' });
    } else if (live && G.newEvos && G.newEvos.length && !pausedUI && !spinAnim && $('ovCard').hidden) {
      const ev = G.newEvos.shift();
      trophy('evo'); if (Object.keys(G.evo).length >= 3) trophy('evo3');
      badgeFx.set(ev.id, 0); sfx.fanfare(); sfx.cheer(true); excite = 1.6; flashA = 0.35; flashC = ev.color;
      for (let k = 0; k < 4; k++) confetti(rnd(80, 460), 220, 45, 60, 300);
      showCard({ icon: ev.id, kick: D.byId(D.GIMMICKS, ev.id).name + ' EVOLVED', title: ev.name, text: ev.desc, color: ev.color, yes: 'OK' });
    }
    if (!pausedUI && !onWheel) {
      acc += dt;
      while (acc >= DT) { G.step(DT); acc -= DT; }
      if (G.events.length) G.events.splice(0).forEach(handle);
      if (!live && G.phase === 'sweep') {            // attract mode plays itself
        demoT -= dt;
        if (demoT <= 0) {
          const pos = G.beams()[0], i = Math.min(N - 1, Math.floor(pos));
          if (G.buzzes >= 5) { G.bank(); demoT = 1; }
          else if (G.isUp(i) && Math.abs(pos - i - 0.5) < 0.3) { G.buzz(); demoT = rnd(0.9, 1.6); }
        }
      }
    }
    if (live && G.phase !== 'wheel') { const sl = $('slow'), can = G.phase === 'sweep' && G.slowLeft > 0 && !(G.slowT > 0); if (sl.disabled === can) sl.disabled = !can; const t = '×' + (G.slowLeft || 0) + ' · S'; if ($('slowSub').textContent !== t) $('slowSub').textContent = t; }
    if (wantBank && G.phase !== 'resolve') { wantBank = false; if (live && G.phase === 'sweep' && G.bank()) sfx.chime(2); }
    if (live && G.phase !== 'wheel') { const b = $('bank'); const can = (G.phase === 'sweep' || G.phase === 'resolve') && G.buzzes > 0 && !wantBank && !G.lv('allin'); if (b.disabled === can) b.disabled = !can; const bz = $('buzz'), cb = G.phase === 'sweep' || !!tally; if (bz.disabled === cb) bz.disabled = !cb; }
    for (let i = 0; i < N; i++) podFx[i] = Math.min(1, podFx[i] + dt);
    for (const [id, f] of badgeFx) { if (f > 1.3) badgeFx.delete(id); else badgeFx.set(id, f + dt); }
    cannonFx[0] = Math.max(0, cannonFx[0] - dt * 5); cannonFx[1] = Math.max(0, cannonFx[1] - dt * 5);
    rivalFx = Math.max(0, rivalFx - dt * 2.5); bossFx = Math.max(0, bossFx - dt * 2.2);
    if (waitBonus && live && (G.phase === 'cleared' || G.phase === 'won')) { waitBonus = false; onCleared(); }
    if (!live && G.phase === 'ask') G.answer(false);
    shiftAnim = Math.max(0, shiftAnim - dt * 4.5); slowFx = Math.max(0, slowFx - dt * 2);
    slam = Math.max(0, slam - dt * 5); deskBump = Math.max(0, deskBump - dt * 6); ballFlash = Math.max(0, ballFlash - dt * 4);
    excite = Math.max(0, Math.min(1.6, excite) - dt * 0.35);
    shake = Math.max(0, shake - dt * 30); flashA = Math.max(0, flashA - dt * 1.4); glitch = Math.max(0, glitch - dt);
    if (G.phase === 'sweep') dark = Math.max(0, dark - dt * 3);

    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    drawBackdrop();
    if (onWheel) {
      drawAudience();
      drawWheel(dt);
      drawFx(dt);
    } else {
      ctx.save();
      if (shake > 0.2) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
      drawBeams();
      drawStrip();
      drawGimmicks(dt);
      drawDesk();
      drawFx(dt);
      ctx.restore();
      if (dark > 0) { ctx.fillStyle = `rgba(3,3,6,${0.7 * dark})`; ctx.fillRect(0, 112, W, H); }
      if (G.slowT > 0 || slowFx > 0) {
        const a = Math.max(slowFx * 0.3, G.slowT > 0 ? 0.14 : 0);
        ctx.fillStyle = `rgba(127,224,255,${a})`; ctx.fillRect(0, 112, W, H);
        if (G.slowT > 0) { font(22); ctx.textBaseline = 'middle'; text('SLOW-MO', W / 2, 470, '#7fe0ff', 'center'); ctx.fillStyle = '#7fe0ff'; ctx.fillRect(W / 2 - 60, 486, 120 * G.slowT / 2.4, 3); }
      }
      if (coin) {
        coin.t += dt;
        const k = Math.min(1, coin.t / 0.8), cy = 520 - Math.sin(k * Math.PI) * 170, flip = k < 1 ? Math.cos(coin.t * 30) : 1;
        drawGlow(W / 2, cy, 80, '#ffd24a', 0.7);
        ctx.save(); ctx.translate(W / 2, cy); ctx.scale(1, Math.max(0.12, Math.abs(flip)));
        ctx.fillStyle = '#a07a12'; ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
        ctx.fillStyle = k >= 1 && !coin.up ? '#8a8aa0' : '#ffd24a'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
        if (k >= 1) { font(30); ctx.textBaseline = 'middle'; text(coin.up ? '×2.5' : '×½', 0, 2, '#07070a', 'center'); }
        ctx.restore();
        if (k >= 1 && !coin.said) { coin.said = true; if (coin.up) { shout('DOUBLE!', C.gold, 70); sfx.fanfare(); sfx.cheer(true); confetti(W / 2, 520, 50, 60, 500); excite = 1.6; } else { shout('NOTHING...', '#8a8aa0', 60); sfx.trombone(); excite = 0; } }
      }
      drawAudience();
      drawMarquee();
      drawTally(dt);
    }
    drawCallout(dt);
    if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    drawGlitch();
    ctx.setTransform(scale, 0, 0, scale, 0, 0); ctx.globalAlpha = 1;
    if (crt) ctx.drawImage(crt, 0, 0, W, H);
  }

  $('mute').textContent = stats.sound ? 'SOUND ON' : 'SOUND OFF';
  if (!Array.isArray(stats.unlocked)) stats.unlocked = [];
  if (!stats.equip) stats.equip = {};
  if (!stats.seen) stats.seen = {};
  if (!stats.codes) stats.codes = {};
  if (!stats.trophies) stats.trophies = {};
  if (!stats.marks) stats.marks = {};
  if (!stats.history) stats.history = [];
  if (stats.heatBest == null) stats.heatBest = stats.wins > 0 ? 0 : -1;
  if ((stats.v || 0) < 2) {       // the vault no longer sells wardrobe: price it by the gameplay unlocks actually owned
    stats.opened = D.UNLOCKS.filter(u => has(u.id)).length; stats.v = 2; save();
  }
  applyLooks();
  // Pick up a newer build without the player having to know about browser caches.
  // Only ever checked from the title screen, so a run in progress is never interrupted.
  const BUILD = '1795835679';
  let buildChecked = 0;
  function checkBuild() {
    if (live || !/^https?:$/.test(location.protocol) || Date.now() - buildChecked < 60000) return;
    buildChecked = Date.now();
    try {
      fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
        const m = /const BUILD = '(\d+)';/.exec(t);
        if (m && +m[1] > +BUILD && !live) location.replace(location.pathname + '?v=' + m[1]);
      }).catch(() => {});
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkBuild(); });
  resize(); paintTitle(); startDemo(); checkBuild();
  requestAnimationFrame(frame);
  window.__deadair = () => G;   // handy for poking at a run from the console
})();
</script>
</body>
</html>
