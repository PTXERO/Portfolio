<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTXERO//SOCIAL</title><!-- social hub v1 -->
<meta name="description" content="The PTXERO network hub">
<script src="design-tokens.js?v=1"></script>
<script src="ascii-render/share.config.js?v=1"></script>
<script src="ptxero-id.js?v=4"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="shared.css?v=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg,#07070a);color:var(--txt,#d8d8e0);font-family:var(--fbody,'DM Mono',monospace);font-size:12px;}
  .ax-hdr{height:44px;min-height:44px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border,#1c1c24);gap:14px;background:var(--surface,#0d0d12);position:sticky;top:0;z-index:50;}
  .ax-logo{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:24px;letter-spacing:.1em;color:var(--acc,#c8f542);line-height:1;flex-shrink:0;}
  .ax-logo em{color:var(--dim,#5a5a70);font-style:normal;}
  .ax-sep{width:1px;height:18px;background:var(--border,#1c1c24);flex-shrink:0;}
  .ax-spacer{flex:1;}
  .ax-btn{padding:4px 11px;border:1px solid var(--b2,#28282f);border-radius:2px;background:transparent;color:var(--dim,#5a5a70);font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.07em;transition:all .15s;text-decoration:none;cursor:pointer;flex-shrink:0;}
  .ax-btn:hover{border-color:var(--acc2,#42d4f5);color:var(--acc2,#42d4f5);}
  /* --pacc = the profile owner's palette accent; set on .wrap so the whole page skins to it */
  .wrap{--pacc:var(--acc,#c8f542);max-width:1100px;margin:0 auto;padding:24px 16px 80px;}
  .s-back{display:inline-block;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.1em;color:var(--dim,#5a5a70);text-decoration:none;margin-bottom:14px;border:1px solid var(--b2,#28282f);border-radius:2px;padding:5px 11px;transition:all .15s;}
  .s-back:hover{border-color:var(--acc2,#42d4f5);color:var(--acc2,#42d4f5);}
  .s-profile{position:relative;overflow:hidden;min-height:104px;border:1px solid var(--b2,#28282f);border-radius:3px;
    background:var(--panel,#101015);box-shadow:var(--shadow,6px 6px 0 #1a1a22);margin:8px 0 6px;}
  .s-pf-bg{position:absolute;inset:0;overflow:hidden;opacity:.30;pointer-events:none;user-select:none;}
  .s-pf-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,16,21,.62),rgba(16,16,21,.06));}
  .s-pf-banner{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none;user-select:none;}
  .s-pf-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,14,.86),rgba(10,10,14,.42));}
  .s-pf-fg{position:relative;z-index:1;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:16px 18px;}
  .s-av{width:52px;height:52px;flex:none;border:1px solid var(--pacc);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:20px;letter-spacing:.06em;color:var(--pacc);background:rgba(10,10,14,.6);background-size:cover;background-position:center;}
  .s-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .s-link{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.04em;color:var(--acc2,#42d4f5);text-decoration:none;border:1px solid var(--b2,#28282f);border-radius:2px;padding:4px 9px;transition:all .15s;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .s-link:hover{border-color:var(--acc2,#42d4f5);}
  .s-who{display:flex;flex-direction:column;gap:2px;flex:1;min-width:200px;}
  .s-handle{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:26px;letter-spacing:.02em;color:var(--txt,#d8d8e0);line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .s-handle .at{color:var(--pacc);}
  .s-uhandle{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:12px;letter-spacing:.05em;color:var(--dim,#5a5a70);line-height:1.2;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .s-uhandle .at{color:var(--pacc);}
  .s-note{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.05em;color:var(--dim,#5a5a70);text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .s-bio{font-family:var(--fbody,'DM Mono',monospace);font-size:12px;line-height:1.6;color:var(--txt,#d8d8e0);margin-top:6px;max-width:60ch;white-space:pre-wrap;text-shadow:0 1px 3px rgba(0,0,0,.7);}
  .s-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .s-count{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;color:var(--dim,#5a5a70);margin-left:auto;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .s-count b{color:var(--pacc);font-size:18px;font-family:var(--fdisp,'Bebas Neue',sans-serif);}
  .s-cta{padding:4px 11px;border:1px solid var(--b2,#28282f);border-radius:2px;background:transparent;color:var(--dim,#5a5a70);
    font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.07em;transition:all .15s;text-decoration:none;cursor:pointer;display:inline-block;}
  .s-cta:hover{border-color:var(--acc2,#42d4f5);color:var(--acc2,#42d4f5);}
  .s-cta.primary{border-color:var(--pacc);color:var(--pacc);}
  .s-cta.primary:hover{border-color:var(--pacc);color:#000;background:var(--pacc);}
  .s-cta.following{border-color:var(--pacc);color:var(--pacc);background:transparent;}
  .s-cta.following:hover{border-color:#e66;color:#e66;background:transparent;}
  .s-stats{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;letter-spacing:.05em;color:var(--dim,#5a5a70);margin-top:8px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .s-stats b{color:var(--txt,#d8d8e0);font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:14px;letter-spacing:.02em;}
  .s-filter{display:flex;gap:8px;margin:22px 2px 16px;align-items:center;}
  .s-tab{cursor:pointer;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:2px;
    border:1px solid var(--b2,#28282f);background:transparent;color:var(--dim,#5a5a70);transition:all .15s;}
  .s-tab:hover{color:var(--txt,#d8d8e0);}
  .s-tab.on{border-color:var(--pacc);color:var(--pacc);}
  .s-label{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--dim,#5a5a70);margin-right:4px;}
  .s-search{flex:1;min-width:120px;max-width:280px;margin-left:auto;background:var(--bg,#07070a);border:1px solid var(--b2,#28282f);border-radius:2px;color:var(--txt,#d8d8e0);font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.05em;padding:6px 10px;}
  .s-search:focus{outline:none;border-color:var(--acc2,#42d4f5);}
  .s-ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
  .s-ucard{display:flex;align-items:center;gap:12px;border:1px solid var(--b2,#28282f);border-radius:3px;background:var(--panel,#101015);padding:12px;text-decoration:none;color:inherit;box-shadow:4px 4px 0 #1a1a22;transition:border-color .15s,transform .06s;}
  .s-ucard:hover{border-color:var(--acc,#c8f542);}
  .s-ucard:active{transform:translateY(1px);}
  .s-uav{width:40px;height:40px;flex:none;border:1px solid var(--acc,#c8f542);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:15px;background:rgba(10,10,14,.6);}
  .s-uinfo{min-width:0;}
  .s-uname{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:16px;letter-spacing:.03em;color:var(--txt,#d8d8e0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .s-usub{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;letter-spacing:.05em;color:var(--dim,#5a5a70);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
  .s-ubio{font-family:var(--fbody,'DM Mono',monospace);font-size:11px;color:var(--dim,#5a5a70);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .s-card{position:relative;display:block;border:1px solid var(--b2,#28282f);border-radius:3px;background:var(--panel,#101015);
    overflow:hidden;text-decoration:none;color:inherit;box-shadow:4px 4px 0 #1a1a22;transition:border-color .15s,transform .06s;}
  .s-card:hover{border-color:var(--cardaccent,var(--acc,#c8f542));}
  .s-card:active{transform:translateY(1px);}
  .s-thumb{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#000;image-rendering:pixelated;border-bottom:1px solid var(--b2,#28282f);}
  /* RF station "signal" card — map screencap + glowing LISTEN */
  .s-rfholo{position:relative;overflow:hidden;border-bottom:1px solid var(--b2,#28282f);background:#07070a;}
  .s-rfmap{display:block;width:100%;height:auto;}
  .s-rfscrim{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 42%, rgba(7,7,10,.22), rgba(7,7,10,.8));pointer-events:none;}
  .s-rfover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 12px;}
  .s-rfk{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:8px;letter-spacing:.28em;color:#42d4f5;opacity:.85;text-shadow:0 1px 4px #000;}
  .s-rfname{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:17px;letter-spacing:.02em;color:#eaffff;margin-top:3px;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 6px #000;}
  .s-rffreq{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:34px;color:#42d4f5;line-height:1;margin:3px 0 2px;text-shadow:0 0 16px rgba(66,212,245,.7),0 1px 6px #000;}
  .s-rfmhz{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;color:#42d4f5;opacity:.8;margin-left:4px;letter-spacing:.1em;}
  .s-rfloc{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;color:#c8f6ff;letter-spacing:.05em;text-shadow:0 1px 4px #000;}
  .s-rflisten{display:inline-block;margin-top:10px;position:relative;z-index:1;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;letter-spacing:.14em;color:#07070a;
    background:#42d4f5;border:1px solid #42d4f5;border-radius:2px;padding:7px 18px;cursor:pointer;transition:all .15s;box-shadow:0 0 16px rgba(66,212,245,.55);}
  .s-rflisten:hover{box-shadow:0 0 26px rgba(66,212,245,.9);transform:translateY(-1px);}
  .s-rfcard:hover{border-color:#42d4f5;}
  /* RF signal-chain / pedalboard card — schematic diagram */
  .s-schemholo{position:relative;aspect-ratio:1/1;border-bottom:1px solid var(--b2,#28282f);overflow:hidden;background:radial-gradient(120% 120% at 50% 50%, rgba(66,212,245,.08), rgba(7,7,10,.9)), repeating-linear-gradient(0deg, rgba(66,212,245,.05) 0 1px, transparent 1px 30px), repeating-linear-gradient(90deg, rgba(66,212,245,.05) 0 1px, transparent 1px 30px), #07070a;}
  .s-schem{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .s-schemk{position:absolute;top:7px;left:9px;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:8px;letter-spacing:.22em;color:#42d4f5;opacity:.85;text-shadow:0 1px 4px #000;z-index:1;pointer-events:none;}
  .s-setupname{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:19px;letter-spacing:.02em;color:#eaffff;margin-bottom:6px;line-height:1.1;}
  .s-loadchain{display:inline-block;margin:6px 0 10px;}
  /* RF audio clip card */
  .s-audholo{position:relative;aspect-ratio:1/1;border-bottom:1px solid var(--b2,#28282f);overflow:hidden;background:radial-gradient(120% 120% at 50% 50%, rgba(66,212,245,.08), rgba(7,7,10,.92)), #07070a;}
  .s-wave{position:absolute;inset:0;width:100%;height:100%;}
  .s-audscrim{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 45%, rgba(7,7,10,.12), rgba(7,7,10,.7));pointer-events:none;}
  .s-audplay{width:54px;height:54px;border-radius:50%;border:1px solid #42d4f5;background:rgba(66,212,245,.16);color:#42d4f5;font-size:19px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(66,212,245,.5);transition:all .15s;margin:6px 0;position:relative;z-index:1;}
  .s-audplay:hover{background:#42d4f5;color:#07070a;transform:translateY(-1px);}
  .s-auddur{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;letter-spacing:.1em;color:#c8f6ff;text-shadow:0 1px 4px #000;}
  .s-textbody{padding:16px 14px;aspect-ratio:1/1;box-sizing:border-box;font-family:var(--fbody,'DM Mono',monospace);font-size:13px;line-height:1.6;
    color:var(--txt,#d8d8e0);white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:9;line-clamp:9;-webkit-box-orient:vertical;
    border-bottom:1px solid var(--b2,#28282f);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);}
  /* text-entry composer */
  .s-compose{display:flex;gap:8px;align-items:flex-start;margin:0 2px 18px;}
  .s-cinput{flex:1;background:var(--panel,#101015);border:1px solid var(--b2,#28282f);border-radius:3px;color:var(--txt,#d8d8e0);
    font-family:var(--fbody,'DM Mono',monospace);font-size:13px;padding:10px 12px;resize:vertical;min-height:44px;line-height:1.5;}
  .s-cinput:focus{outline:none;border-color:var(--pacc,#c8f542);}
  .s-body{padding:10px 11px 12px;}
  .s-name{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:17px;letter-spacing:.02em;color:var(--txt,#d8d8e0);line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .s-cap{font-family:var(--fbody,'DM Mono',monospace);font-size:11px;line-height:1.4;color:var(--dim,#5a5a70);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;}
  .s-tag{color:var(--pacc,#c8f542);cursor:pointer;}
  .s-tag:hover{text-decoration:underline;}
  .s-url{color:var(--acc2,#42d4f5);cursor:pointer;text-decoration:underline;word-break:break-all;}
  .s-taghead{display:flex;align-items:baseline;gap:12px;margin:6px 2px 20px;padding-bottom:14px;border-bottom:1px solid var(--b2,#28282f);}
  .s-tagname{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:34px;letter-spacing:.02em;color:var(--pacc,#c8f542);line-height:1;}
  .s-tagsub{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.15em;color:var(--dim,#5a5a70);text-transform:uppercase;}
  .s-reports{display:flex;flex-direction:column;gap:12px;}
  .s-report{border:1px solid var(--b2,#28282f);border-radius:3px;background:var(--panel,#101015);padding:13px 15px;box-shadow:4px 4px 0 #1a1a22;}
  .s-rmeta{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .s-rlink{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;letter-spacing:.05em;color:var(--acc2,#42d4f5);text-decoration:none;}
  .s-rlink:hover{text-decoration:underline;}
  .s-rwhen{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;color:var(--dim,#5a5a70);}
  .s-rreason{font-family:var(--fbody,'DM Mono',monospace);font-size:13px;line-height:1.5;color:var(--txt,#d8d8e0);margin:8px 0 4px;white-space:pre-wrap;word-break:break-word;}
  .s-rby{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;letter-spacing:.05em;color:var(--dim,#5a5a70);}
  .s-ractions{display:flex;gap:8px;margin-top:10px;}
  .s-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;letter-spacing:.05em;color:var(--dim,#5a5a70);}
  .s-meta .h{color:var(--acc,#c8f542);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .s-repost{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;letter-spacing:.05em;color:var(--acc2,#42d4f5);padding:7px 11px 0;}
  .s-mleft{display:inline-flex;align-items:center;gap:5px;min-width:0;}
  .s-mav{width:18px;height:18px;flex:none;border-radius:50%;border:1px solid var(--b2,#28282f);background:rgba(10,10,14,.6);background-size:cover;background-position:center;overflow:hidden;
    display:inline-flex;align-items:center;justify-content:center;font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:8px;letter-spacing:0;}
  .s-del{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;border:1px solid rgba(230,80,80,.5);
    background:rgba(10,8,10,.82);color:#e66;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:13px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s,background .12s,transform .06s;z-index:2;}
  .s-card:hover .s-del{opacity:1;}
  .s-del:hover{background:#e66;color:#0a0a0a;}
  .s-del:active{transform:scale(.9);}
  @media (hover: none){ .s-del{opacity:.92;} }
  .s-feat{position:absolute;top:7px;left:7px;width:24px;height:24px;border-radius:50%;border:1px solid rgba(200,245,66,.45);
    background:rgba(10,8,10,.82);color:var(--pacc,#c8f542);font-family:var(--fmono,'Share Tech Mono',monospace);font-size:12px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s,transform .06s;z-index:2;}
  .s-card:hover .s-feat{opacity:1;}
  .s-feat.on{opacity:1;border-color:var(--pacc,#c8f542);}
  .s-feat:active{transform:scale(.9);}
  @media (hover: none){ .s-feat{opacity:.9;} }
  .s-mright{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .s-cmt{display:inline-flex;align-items:center;gap:2px;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;color:var(--dim,#5a5a70);}
  .s-like{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--b2,#28282f);border-radius:10px;background:transparent;
    color:var(--dim,#5a5a70);font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;line-height:1;padding:2px 7px;cursor:pointer;transition:all .12s;}
  .s-like:hover{border-color:#f542a8;color:#f542a8;}
  .s-like.on{border-color:#f542a8;color:#f542a8;}
  .s-like .heart{font-size:11px;}
  .s-like:active{transform:scale(.94);}
  .s-save{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--b2,#28282f);border-radius:10px;background:transparent;
    color:var(--dim,#5a5a70);font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;line-height:1;padding:2px 7px;cursor:pointer;transition:all .12s;}
  .s-save:hover{border-color:var(--acc2,#42d4f5);color:var(--acc2,#42d4f5);}
  .s-save.on{border-color:var(--acc2,#42d4f5);color:var(--acc2,#42d4f5);}
  .s-save:active{transform:scale(.94);}
  .s-msg{font-family:var(--fmono,'Share Tech Mono',monospace);color:var(--dim,#5a5a70);padding:70px 0;text-align:center;font-size:12px;line-height:1.7;}
  /* modals */
  .ob-ov{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(3,3,6,.82);backdrop-filter:blur(3px);font-family:var(--fmono,'Share Tech Mono',monospace);padding:16px;}
  .ob-panel{background:var(--panel,#101015);border:1px solid var(--acc,#c8f542);border-radius:3px;box-shadow:var(--shadow,6px 6px 0 #1a1a22);max-width:min(94vw,460px);width:100%;padding:22px;color:var(--txt,#d8d8e0);max-height:92vh;overflow:auto;}
  .ob-title{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:26px;letter-spacing:.04em;color:var(--acc,#c8f542);line-height:1;margin-bottom:10px;}
  .ob-p{font-size:12px;line-height:1.7;margin:0 0 12px;}
  .ob-dim{color:var(--dim,#5a5a70);}
  .ob-lbl{display:block;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim,#5a5a70);margin:14px 0 2px;}
  .ob-handle{font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:30px;letter-spacing:.04em;color:var(--acc,#c8f542);text-align:center;margin:14px 0;padding:12px;border:1px dashed rgba(200,245,66,.4);border-radius:3px;}
  .ob-input{width:100%;box-sizing:border-box;background:var(--bg,#07070a);border:1px solid var(--b2,#28282f);border-radius:2px;color:var(--txt,#d8d8e0);font-family:var(--fmono,'Share Tech Mono',monospace);font-size:14px;padding:11px;margin:2px 0;letter-spacing:.06em;}
  .ob-input:focus{outline:none;border-color:var(--acc,#c8f542);}
  textarea.ob-input{resize:vertical;min-height:64px;line-height:1.5;font-family:var(--fbody,'DM Mono',monospace);}
  .ob-sws{display:flex;gap:10px;margin:6px 0 2px;}
  .ob-sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s;padding:0;}
  .ob-sw:hover{transform:scale(1.12);}
  .ob-sw.on{border-color:var(--txt,#d8d8e0);}
  .ob-styles{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px;}
  .ob-style{flex:1;min-width:64px;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:8px 6px;border-radius:2px;border:1px solid var(--b2,#28282f);background:transparent;color:var(--dim,#5a5a70);cursor:pointer;transition:all .15s;}
  .ob-style:hover{color:var(--txt,#d8d8e0);}
  .ob-style.on{border-color:var(--acc,#c8f542);color:var(--acc,#c8f542);}
  .ob-btn{display:block;width:100%;box-sizing:border-box;text-align:center;cursor:pointer;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;letter-spacing:.1em;padding:11px;border-radius:2px;border:1px solid var(--b2,#28282f);background:transparent;color:var(--txt,#d8d8e0);margin-top:12px;transition:all .15s;}
  .ob-btn.primary{border-color:var(--acc,#c8f542);color:var(--acc,#c8f542);}
  .ob-btn:hover{border-color:var(--acc2,#42d4f5);color:var(--acc2,#42d4f5);}
  .ob-btn.primary:hover{border-color:var(--acc,#c8f542);color:#000;background:var(--acc,#c8f542);}
  .ob-div{display:flex;align-items:center;gap:10px;color:var(--dim,#5a5a70);font-size:9px;letter-spacing:.15em;margin:14px 0;}
  .ob-div::before,.ob-div::after{content:'';flex:1;height:1px;background:var(--b2,#28282f);}
  .ob-skip{display:block;text-align:center;margin-top:14px;font-size:10px;letter-spacing:.08em;color:var(--dim,#5a5a70);cursor:pointer;background:none;border:none;width:100%;}
  .ob-skip:hover{color:var(--txt,#d8d8e0);}
  /* edit-profile avatar picker */
  .ep-avrow{display:flex;align-items:center;gap:14px;margin:2px 0 8px;}
  .ep-av{width:60px;height:60px;flex:none;border-radius:50%;border:1px solid var(--acc,#c8f542);background:rgba(10,10,14,.6);background-size:cover;background-position:center;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:22px;color:var(--acc,#c8f542);}
  .ep-avbtn{cursor:pointer;font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.1em;padding:8px 12px;border:1px solid var(--b2,#28282f);border-radius:2px;color:var(--dim,#5a5a70);transition:all .15s;}
  .ep-avbtn:hover{border-color:var(--acc2,#42d4f5);color:var(--acc2,#42d4f5);}
  .ep-bnrow{display:flex;align-items:center;gap:14px;margin:2px 0 8px;}
  .ep-bn{width:120px;height:42px;flex:none;border-radius:3px;border:1px solid var(--b2,#28282f);background:rgba(10,10,14,.6);background-size:cover;background-position:center;}
  /* identical to the view-page ✕ DELETE button (.v-btn.danger), just labelled REMOVE */
  .ep-rm{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:10px;letter-spacing:.07em;padding:8px 14px;border-radius:2px;border:1px solid rgba(230,80,80,.5);background:transparent;color:#e66;transition:all .15s;}
  .ep-rm:hover{border-color:#e66;color:#e66;background:transparent;}
  /* notifications */
  .ax-bell{position:relative;font-size:13px;line-height:1;}
  .ax-badge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#f542a8;color:#0a0a0e;
    font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;line-height:15px;text-align:center;font-weight:700;box-sizing:border-box;}
  .n-panel{position:absolute;top:44px;right:10px;width:330px;max-width:calc(100vw - 20px);max-height:72vh;overflow-y:auto;
    background:var(--surface,#0d0d12);border:1px solid var(--b2,#28282f);border-radius:4px;box-shadow:0 10px 34px rgba(0,0,0,.6);z-index:200;}
  .n-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;font-family:var(--fmono,'Share Tech Mono',monospace);
    font-size:10px;letter-spacing:.18em;color:var(--dim,#5a5a70);border-bottom:1px solid var(--b2,#28282f);position:sticky;top:0;background:var(--surface,#0d0d12);}
  .n-item{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;text-decoration:none;color:var(--txt,#d8d8e0);border-bottom:1px solid rgba(40,40,47,.4);}
  .n-item:last-child{border-bottom:none;}
  .n-item:hover{background:rgba(255,255,255,.03);}
  .n-item.unread{background:rgba(245,66,168,.07);}
  .n-av{width:30px;height:30px;flex:none;border:1px solid var(--b2,#28282f);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--fdisp,'Bebas Neue',sans-serif);font-size:12px;background:rgba(10,10,14,.6);}
  .n-body{flex:1;min-width:0;}
  .n-txt{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;line-height:1.45;color:var(--txt,#d8d8e0);}
  .n-txt .who{font-weight:500;}
  .n-when{font-family:var(--fmono,'Share Tech Mono',monospace);font-size:9px;color:var(--dim,#5a5a70);margin-top:2px;letter-spacing:.05em;}
  .n-dot{width:6px;height:6px;border-radius:50%;background:#f542a8;flex:none;margin-top:6px;}
  .n-empty{padding:30px 14px;text-align:center;color:var(--dim,#5a5a70);font-family:var(--fmono,'Share Tech Mono',monospace);font-size:11px;letter-spacing:.05em;}
</style>

<body>
<header class="ax-hdr">
  <a class="ax-btn" href="./">← HOME</a>
  <div class="ax-sep"></div>

  <div class="ax-spacer"></div>
  <button class="ax-btn ax-bell" id="btnNotif" type="button" style="display:none;" title="Notifications">✦<span class="ax-badge" id="notifBadge" style="display:none;"></span></button>
  <a class="ax-btn" href="ascii-render/">ASCII//RENDER</a>
  <a class="ax-btn" href="rf/">RF</a>
</header>

<div class="wrap">
  <a class="s-back" id="backFeed" href="social.html" style="display:none;">← ALL ENTRIES</a>
  <div class="s-profile" id="pfBox">
    <div class="s-pf-banner" id="pfBanner" aria-hidden="true" style="display:none;"></div>
    <div class="s-pf-bg" id="pfBg" aria-hidden="true"></div>
    <div class="s-pf-fg">
      <div class="s-av" id="pfAv">@</div>
      <div class="s-who">
        <div class="s-handle"><span class="at" id="pfAt">@</span><span id="pfHandle">…</span><span id="pfLive" class="pf-live" style="display:none;"></span></div>
        <div class="s-uhandle" id="pfUser" style="display:none;"><span class="at">@</span><span id="pfUserName"></span></div>
        <div class="s-note" id="pfNote"></div>

        <div class="s-links" id="pfLinks" style="display:none;"></div>
        <div class="s-stats" id="pfStats" style="display:none;"><b id="pfFollowers">0</b> followers · <b id="pfFollowing">0</b> following</div>
        <div class="s-actions" id="pfActions">
          <button class="s-cta primary" id="btnNewEntry" type="button">＋ NEW ENTRY</button>
          <button class="s-cta" id="btnEdit" type="button">✎ EDIT PROFILE</button>
          <button class="s-cta" id="btnKey" type="button">⚿ MY KEY</button>
          <a class="s-cta" id="btnReports" href="social.html?reports=1" style="display:none;">◆ REPORTS</a>
        </div>
        <div class="s-actions" id="pfFollowActions" style="display:none;">
          <button class="s-cta primary" id="btnFollow" type="button">＋ FOLLOW</button>
        </div>
        <div class="s-actions" id="pfLiveActions" style="display:none;"><a class="s-cta primary" id="pfConnect" title="Tune your RF to the exact station they're hearing right now">◎ CONNECT</a></div>
      </div>
      <div class="s-count"><b id="pfCount">0</b><br><span id="pfCountLabel">your entries</span></div>
    </div>
  </div>

  <div id="liveNow" class="live-rail" style="display:none;"></div>

  <div class="s-filter" id="sFilter">
    <span class="s-label">FEED</span>

    <input class="s-search" id="userSearch" type="search" placeholder="find users…" autocomplete="off">
  </div>

  <div id="feed"><div class="s-msg">Loading…</div></div>
</div>

<script>
(function(){
  const CFG = window.SHARE || {};
  if (window.PX) {   // YOUR DATA → "my own hub": every PTXERO app follows the same choice
    const H = window.PX.host();
    if (H.mode === 'own') { CFG.workerUrl = H.hub; if (H.supabaseUrl) CFG.supabaseUrl = H.supabaseUrl; if (H.supabaseAnonKey) CFG.supabaseAnonKey = H.supabaseAnonKey; }
    else if (!CFG.workerUrl) CFG.workerUrl = H.hub;
  }
  if(CFG.supabaseUrl) CFG.supabaseUrl = CFG.supabaseUrl.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
  const feed = document.getElementById('feed');
  const READY = CFG.supabaseUrl && !/YOURPROJECT/.test(CFG.supabaseUrl) && CFG.supabaseAnonKey && !/YOUR_ANON/.test(CFG.supabaseAnonKey);
  const publicUrl = (p) => `${CFG.supabaseUrl}/storage/v1/object/public/${CFG.bucket}/${p}`;
  const workerBase = (CFG.workerUrl && /^https?:/.test(CFG.workerUrl)) ? CFG.workerUrl.replace(/\/+$/,'') : '';
  // every write carries the PTXERO ID signature (the hub binds the key on first use; from then on only it may act as @you)
  async function pxPost(path, fd){ const url = workerBase + path; const headers = window.PX ? await window.PX.sign('POST', url) : {}; return fetch(url, { method:'POST', body: fd, headers }); }
  const anonHdr = { apikey: CFG.supabaseAnonKey, Authorization: 'Bearer ' + CFG.supabaseAnonKey };

  const PALETTE = ['#c8f542','#42d4f5','#f542a8','#f5a542'];
  const DEFAULT_COLOR = '#c8f542';

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  // linkify #tags + URLs in already-escaped text as spans; wired via JS click (avoids nested <a> inside card anchors)
  function linkifyTags(escaped){
    return String(escaped)
      .replace(/\bhttps?:\/\/[^\s<]+/g, (u) => { const t = (u.match(/[.,!?)]+$/) || [''])[0]; const c = u.slice(0, u.length - t.length); return '<span class="s-url" data-url="' + c + '">' + c + '</span>' + t; })
      .replace(/(^|\s)#(\w{1,30})/g, (m, pre, tag) => pre + '<span class="s-tag" data-tag="' + tag.toLowerCase() + '">#' + tag + '</span>');
  }
  function wireTags(el){
    el.querySelectorAll('.s-tag').forEach(t => t.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); location.href = 'social.html?tag=' + encodeURIComponent(t.dataset.tag); }));
    el.querySelectorAll('.s-url').forEach(t => t.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); const u = String(t.dataset.url || '').replace(/&amp;/g,'&').replace(/&quot;/g,'"'); if(/^https?:\/\//.test(u)) window.open(u, '_blank', 'noopener'); }));
  }
  function msg(t){ feed.innerHTML = '<div class="s-msg">' + t + '</div>'; }

  const ID_KEY = 'ptxero_rf_player_id', ACK_KEY = 'ptxero_social_onboarded', BG_KEY = 'ptxero_social_bg', PFX_KEY = 'ptxero_handle_prefix';
  function getRawId(){ try{ return localStorage.getItem(ID_KEY); }catch(e){ return null; } }
  function ensureId(){ let id = getRawId(); if(!id){ id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'rf-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); try{ localStorage.setItem(ID_KEY, id); }catch(e){} } return id; }
  function cleanPrefix(v){ return String(v||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,2); }
  function handlePrefix(){ let p=''; try{ p = localStorage.getItem(PFX_KEY)||''; }catch(e){} return cleanPrefix(p) || 'RF'; }
  function handleSuffix(){ const id = getRawId(); if(!id) return null; let h = 0; for(let i=0;i<id.length;i++){ h=(h*31 + id.charCodeAt(i))>>>0; } return h.toString(16).toUpperCase().slice(0,4).padStart(4,'0'); }
  function myHandle(){ const s = handleSuffix(); return s ? handlePrefix()+'-'+s : null; }
  function suffixOf(h){ return String(h||'').split('-').pop(); }
  function myTokens(){ try { return JSON.parse(localStorage.getItem('ptxero_my_renders')||'{}'); } catch(e){ return {}; } }
  async function sha256hex(str){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
  async function identitySecret(){ const id = getRawId(); return id ? await sha256hex(id + '|ptxero-profile-secret-v1') : null; }
  // cover-crop an image file to a WxH JPEG (used for avatar + banner)
  function resizeCover(file, W, H){
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d');
        const scale = Math.max(W / img.width, H / img.height), w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        cv.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', 0.85);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => rej(new Error('not an image'));
      img.src = URL.createObjectURL(file);
    });
  }
  function resizeToAvatar(file){ return resizeCover(file, 160, 160); }
  function resizeToBanner(file){ return resizeCover(file, 1000, 280); }
  function avatarUrl(uid, ver){ return publicUrl('avatars/' + uid + '.jpg') + (ver ? ('?v=' + ver) : ''); }
  function bannerUrl(uid, ver){ return publicUrl('banners/' + uid + '.jpg') + (ver ? ('?v=' + ver) : ''); }

  // ── profiles ──
  async function fetchProfile(uid){
    if(!uid || !READY) return null;
    const base = `${CFG.supabaseUrl}/rest/v1/profiles?uid=eq.${encodeURIComponent(uid)}`;
    try{
      let r = await fetch(base + '&select=uid,prefix,bio,theme,featured', { headers: anonHdr });
      if(r.status === 400) r = await fetch(base + '&select=uid,prefix,bio,featured', { headers: anonHdr });
      if(!r.ok) return null;
      return (await r.json())[0] || null;
    }catch(e){ return null; }
  }
  // batch: map of suffix → chosen palette color (for coloring @handles in the feed)
  async function fetchColors(suffixes){
    const uniq = [...new Set(suffixes.filter(Boolean))];
    if(!uniq.length || !READY) return {};
    try{
      const r = await fetch(`${CFG.supabaseUrl}/rest/v1/profiles?uid=in.(${uniq.map(encodeURIComponent).join(',')})&select=uid,theme`, { headers: anonHdr });
      if(!r.ok) return {};
      const rows = await r.json(); const map = {};
      rows.forEach(row => { const t = row.theme || {}; map[row.uid] = { color: (PALETTE.indexOf(t.color) >= 0 ? t.color : null), name: (t.name && String(t.name).trim()) ? String(t.name).trim() : null, avatar: t.avatar || null }; });
      return map;
    }catch(e){ return {}; }
  }
  // batch: map of slug → { count, mine } for like counts + whether I liked it
  async function fetchLikes(slugs){
    const uniq = [...new Set((slugs||[]).filter(Boolean))];
    if(!uniq.length || !READY) return {};
    try{
      const r = await fetch(`${CFG.supabaseUrl}/rest/v1/likes?slug=in.(${uniq.map(encodeURIComponent).join(',')})&select=slug,uid`, { headers: anonHdr });
      if(!r.ok) return {};
      const rows = await r.json(); const map = {};
      rows.forEach(row => { const m = map[row.slug] || (map[row.slug] = { count: 0, mine: false }); m.count++; if(MY_SUFFIX && row.uid === MY_SUFFIX) m.mine = true; });
      return map;
    }catch(e){ return {}; }
  }
  // batch: map of slug → comment count
  async function fetchComments(slugs){
    const uniq = [...new Set((slugs||[]).filter(Boolean))];
    if(!uniq.length || !READY) return {};
    try{
      const r = await fetch(`${CFG.supabaseUrl}/rest/v1/comments?slug=in.(${uniq.map(encodeURIComponent).join(',')})&select=slug`, { headers: anonHdr });
      if(!r.ok) return {};
      const rows = await r.json(); const map = {};
      rows.forEach(row => { map[row.slug] = (map[row.slug] || 0) + 1; });
      return map;
    }catch(e){ return {}; }
  }
  async function saveProfile(fields){
    const uid = handleSuffix(); const secret = await identitySecret();
    if(!uid || !secret || !workerBase) throw new Error('profile backend unavailable');
    const fd = new FormData(); fd.append('uid', uid); fd.append('secret', secret);
    if(fields.prefix !== undefined) fd.append('prefix', fields.prefix);
    if(fields.bio    !== undefined) fd.append('bio', fields.bio);
    if(fields.theme  !== undefined) fd.append('theme', JSON.stringify(fields.theme));
    if(fields.featured !== undefined) fd.append('featured', JSON.stringify(fields.featured));
    if(fields.avatarBlob) fd.append('avatar', fields.avatarBlob, 'avatar.jpg');
    if(fields.bannerBlob) fd.append('banner', fields.bannerBlob, 'banner.jpg');
    const r = await pxPost('/profile', fd);
    if(!r.ok) throw new Error('profile ' + r.status + ' ' + await r.text());
  }

  // ── key file ──
  function buildKey(){ let key = null; try{ key = JSON.parse(localStorage.getItem('ptxero_key_v1') || 'null'); }catch(e){}
    return { _type:'ptxero-identity', version: key ? 2 : 1, playerId:getRawId(), prefix:handlePrefix(), handle:myHandle(), renders:myTokens(), key, host: (window.PX && window.PX.host().mode === 'own') ? window.PX.host() : null, exported:new Date().toISOString() }; }
  function downloadKey(){
    const data = buildKey(); const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'}); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'ptxero-key-'+(data.handle||'anon')+'.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500); try{ localStorage.setItem(ACK_KEY,'1'); }catch(e){}
  }
  function applyImport(text){
    const d = JSON.parse(text);
    if(!d || d._type !== 'ptxero-identity' || !d.playerId) throw new Error('Not a valid PTXERO key file.');
    try{ localStorage.setItem(ID_KEY, d.playerId); }catch(e){}
    if(d.prefix){ try{ localStorage.setItem(PFX_KEY, cleanPrefix(d.prefix)); }catch(e){} }
    if(d.renders && typeof d.renders === 'object'){ const merged = Object.assign({}, myTokens(), d.renders); try{ localStorage.setItem('ptxero_my_renders', JSON.stringify(merged)); }catch(e){} }
    if(d.key && d.key.priv && d.key.pub){ try{ localStorage.setItem('ptxero_key_v1', JSON.stringify(d.key)); }catch(e){} }   // v2 key files carry the signing key
    if(d.host && d.host.mode === 'own' && window.PX) window.PX.setHost(d.host);
    try{ localStorage.setItem(ACK_KEY,'1'); }catch(e){}
  }

  // ── modals ──
  function closeModal(){ const o = document.getElementById('obOverlay'); if(o) o.remove(); }
  function makeOverlay(dismissable){
    closeModal();
    const ov = document.createElement('div'); ov.id = 'obOverlay'; ov.className = 'ob-ov';
    const panel = document.createElement('div'); panel.className = 'ob-panel';
    ov.appendChild(panel); document.body.appendChild(ov);
    if(dismissable) ov.addEventListener('click', e => { if(e.target === ov) closeModal(); });
    return panel;
  }
  // ── New Entry: choose a content type (text / render / RF) ──
  function showNewEntry(){
    const panel = makeOverlay(true);
    function chooser(){
      panel.innerHTML =
          '<div class="ob-title">＋ NEW ENTRY</div>'
        + '<button class="ob-btn primary" data-act="text">✎ TEXT ENTRY</button>'
        + '<button class="ob-btn" data-act="render">▦ ASCII RENDER</button>'

  let BG_TEXT = 'PTXERO', BG_STYLE = 'drift';
  const BG_GLYPHS = '░▒▓·:+=/'.split('');
  function bgPool(text){ const t = String(text||'').replace(/\s+/g,''); return (t.length ? t : 'PTXERO').split(''); }
  function bgChar(pool){ return Math.random()<0.62 ? pool[(Math.random()*pool.length)|0] : BG_GLYPHS[(Math.random()*BG_GLYPHS.length)|0]; }
  function makeProfileBg(host, text, style){
    if(!host) return null; host.innerHTML = '';
    const pool = bgPool(text); const COL_W = 13, ROW_H = 14;
    const W = host.offsetWidth, H = host.offsetHeight; if(W<=0||H<=0) return null;
    const rows = Math.ceil(H/ROW_H)+1;
    style = (BG_STYLES.indexOf(style) >= 0) ? style : 'drift';
    let raf, frame = 0;
    if(style === 'drift'){
      const numCols = Math.ceil(W/COL_W)+4, SPEED = 0.28;
      const shade = () => Math.random()<0.72 ? 'var(--dim,#5a5a70)' : 'var(--pacc,#c8f542)';
      const cols = [];
      for(let i=0;i<numCols;i++){
        const col = document.createElement('div');
        col.style.cssText = 'position:absolute;top:0;bottom:0;width:'+COL_W+'px;left:'+(i*COL_W)+'px;display:flex;flex-direction:column;font-family:var(--fmono,monospace);font-size:11px;line-height:'+ROW_H+'px;';
        const cells = [];
        for(let r=0;r<rows;r++){ const s=document.createElement('span'); s.textContent=bgChar(pool); s.style.color=shade(); col.appendChild(s); cells.push(s); }
        host.appendChild(col); cols.push({ el: col, x: i*COL_W, cells });
      }
      (function tick(){ const totalW=cols.length*COL_W; for(const c of cols){ c.x-=SPEED; if(c.x<-COL_W){ c.x=totalW-COL_W; c.cells.forEach(s=>{ s.textContent=bgChar(pool); s.style.color=shade(); }); } c.el.style.left=Math.round(c.x)+'px'; } raf=requestAnimationFrame(tick); })();
      return () => cancelAnimationFrame(raf);
    }
    // grid of fixed cells for rain/static/pulse
    const numCols = Math.ceil(W/COL_W)+2; const grid = [];
    for(let c=0;c<numCols;c++){
      const col=document.createElement('div');
      col.style.cssText='position:absolute;top:0;bottom:0;width:'+COL_W+'px;left:'+(c*COL_W)+'px;display:flex;flex-direction:column;font-family:var(--fmono,monospace);font-size:11px;line-height:'+ROW_H+'px;';
      const cells=[]; for(let r=0;r<rows;r++){ const s=document.createElement('span'); s.textContent=bgChar(pool); s.style.color='var(--dim,#5a5a70)'; col.appendChild(s); cells.push(s); }
      host.appendChild(col); grid.push(cells);
    }
    if(style === 'rain'){
      const TRAIL=8; const drops=[]; for(let c=0;c<numCols;c++) drops.push({ y:-((Math.random()*rows*2)|0), sp:0.12+Math.random()*0.4 });
      for(let c=0;c<numCols;c++) for(let r=0;r<rows;r++) grid[c][r].style.opacity='0';
      (function tick(){ for(let c=0;c<numCols;c++){ const d=drops[c]; d.y+=d.sp; const head=Math.floor(d.y);
          for(let r=0;r<rows;r++){ const s=grid[c][r]; const dist=head-r;
            if(dist===0){ s.textContent=bgChar(pool); s.style.color='var(--pacc,#c8f542)'; s.style.opacity='1'; }
            else if(dist>0 && dist<TRAIL){ s.style.color='var(--pacc,#c8f542)'; s.style.opacity=String((1-dist/TRAIL)*0.6); }
            else s.style.opacity='0'; }
          if(head-TRAIL>rows){ d.y=-((Math.random()*rows)|0); d.sp=0.12+Math.random()*0.4; } }
        raf=requestAnimationFrame(tick); })();
      return () => cancelAnimationFrame(raf);
    }
    if(style === 'static'){
      for(let c=0;c<numCols;c++) for(let r=0;r<rows;r++) grid[c][r].style.opacity=String(0.35+Math.random()*0.5);
      (function tick(){ frame++; if(frame%2===0){ const n=Math.ceil(numCols*rows*0.03); for(let k=0;k<n;k++){ const c=(Math.random()*numCols)|0, r=(Math.random()*rows)|0, s=grid[c][r]; s.textContent=bgChar(pool); s.style.color=Math.random()<0.25?'var(--pacc,#c8f542)':'var(--dim,#5a5a70)'; s.style.opacity=String(0.35+Math.random()*0.6); } } raf=requestAnimationFrame(tick); })();
      return () => cancelAnimationFrame(raf);
    }
    // pulse — a bright band sweeps across
    for(let c=0;c<numCols;c++) for(let r=0;r<rows;r++){ grid[c][r].style.color='var(--dim,#5a5a70)'; grid[c][r].style.opacity='0.45'; }
    const BAND=4; let sweep=-BAND;
    (function tick(){ frame++; if(frame%2===0){ sweep+=0.6; if(sweep>numCols+BAND) sweep=-BAND;
        for(let c=0;c<numCols;c++){ const dist=Math.abs(c-sweep); const near=dist<BAND;
          for(let r=0;r<rows;r++){ const s=grid[c][r]; if(near){ s.style.color='var(--pacc,#c8f542)'; s.style.opacity=String(Math.max(.45,1-dist/BAND)); if(Math.random()<0.06) s.textContent=bgChar(pool); } else { s.style.color='var(--dim,#5a5a70)'; s.style.opacity='0.4'; } } } }
      raf=requestAnimationFrame(tick); })();
    return () => cancelAnimationFrame(raf);
  }

  // resolve entries reposted by a set of users → feed items tagged with _repostBy (repost-time ordering)
  async function loadRepostsBy(sufs){

      const rp = await fetch(`${CFG.supabaseUrl}/rest/v1/reposts?uid=in.(${sufs.map(encodeURIComponent).join(',')})&select=uid,target,kind,created_at&order=created_at.desc&limit=100`, { headers: anonHdr });
      if(!rp.ok) return [];
      const reposts = await rp.json(); if(!reposts.length) return [];
      const rTargets = [...new Set(reposts.filter(r => r.kind !== 'text').map(r => r.target))];
      const pTargets = [...new Set(reposts.filter(r => r.kind === 'text').map(r => r.target))];
      const [rt, pt] = await Promise.all([
        rTargets.length ? fetch(`${CFG.supabaseUrl}/rest/v1/renders?slug=in.(${rTargets.map(encodeURIComponent).join(',')})&select=slug,title,description,handle,created_at,media`, { headers: anonHdr }) : null,
        pTargets.length ? fetch(`${CFG.supabaseUrl}/rest/v1/posts?id=in.(${pTargets.map(encodeURIComponent).join(',')})&select=id,body,handle,uid,created_at,kind,data`, { headers: anonHdr }) : null,
      ]);
      const rmap = {}; if(rt && rt.ok){ (await rt.json()).forEach(x => { rmap[x.slug] = Object.assign({ _type:'render' }, x); }); }
      const pmap = {}; if(pt && pt.ok){ (await pt.json()).forEach(p => { pmap[p.id] = { _type:'text', slug:p.id, body:p.body, handle:p.handle, created_at:p.created_at }; }); }
      const out = [];
      reposts.forEach(r => {
        const item = (r.kind === 'text') ? pmap[r.target] : rmap[r.target];

    if(!iso) return '';

  // world coastline drawn once to an offscreen canvas (equirectangular), reused per RF card
  let _rfWorld = null, _rfWorldP = null;
  function rfWorld(){
    if(_rfWorld) return Promise.resolve(_rfWorld);
    if(_rfWorldP) return _rfWorldP;
    _rfWorldP = fetch('rf/coastline.json').then(r => r.ok ? r.json() : null).then(geo => {
      const W = 1440, H = 720, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
      ctx.fillStyle = '#07070a'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(66,212,245,.14)'; ctx.lineWidth = 1;
      for(let gx = 0; gx <= W; gx += W/8){ ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      for(let gy = 0; gy <= H; gy += H/4){ ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
      if(geo && geo.features){
        ctx.strokeStyle = 'rgba(66,212,245,.55)'; ctx.lineWidth = 0.6; ctx.beginPath();
        geo.features.forEach(f => { const g = f.geometry; if(!g) return;
          const lines = g.type === 'LineString' ? [g.coordinates] : g.type === 'MultiLineString' ? g.coordinates : [];
          lines.forEach(co => co.forEach((c, i) => { const x = (c[0]+180)/360*W, y = (90-c[1])/180*H; if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y); })); });
        ctx.stroke();
      }
      _rfWorld = cv; return cv;
    }).catch(() => { const cv = document.createElement('canvas'); cv.width = 640; cv.height = 320; _rfWorld = cv; return cv; });
    return _rfWorldP;
  }
  function drawRfMap(canvas, lat, lon){

  function boardFromChain(chain){

    const nodes = [{ id:'__source__', label:'RF IN', kind:'src' }];

  // Draw a signal-chain SCHEMATIC from a board {nodes:[{id,label,kind}], edges:[{f,t}]}.

  function scRoundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function drawChainSchematic(canvas, board){
    if(!canvas) return false;
    const ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
    ctx.clearRect(0,0,W,H);
    if(!board || !Array.isArray(board.nodes) || !board.nodes.length) return false;
    const nodes=board.nodes, edges=Array.isArray(board.edges)?board.edges:[];
    const byId={}; nodes.forEach(n=>byId[n.id]=n);
    const layer={}; nodes.forEach(n=>layer[n.id]=0);
    for(let it=0; it<nodes.length+1; it++){ let ch=false;
      edges.forEach(e=>{ if(byId[e.f]&&byId[e.t] && layer[e.t]<layer[e.f]+1){ layer[e.t]=layer[e.f]+1; ch=true; } });
      if(!ch) break; }
    let maxL=0; nodes.forEach(n=>{ if(layer[n.id]>maxL) maxL=layer[n.id]; });
    nodes.forEach(n=>{ if(n.kind==='out') layer[n.id]=maxL; });   // OUTPUT pinned far right
    const grouped={}; nodes.forEach(n=>{ (grouped[layer[n.id]]=grouped[layer[n.id]]||[]).push(n); });
    let maxRows=1; Object.keys(grouped).forEach(L=>{ if(grouped[L].length>maxRows) maxRows=grouped[L].length; });
    const padX=W*0.05, padY=H*0.09;
    const colStep0=(W-2*padX)/Math.max(1,maxL), rowStep0=(H-2*padY)/Math.max(1,maxRows);
    const bw=Math.min(colStep0*0.58, W*0.16);                 // box sized to the cell first…

    const innerX=padX+bw/2, innerY=padY+bh/2;                 // …then columns inset so ends never clip

    Object.keys(grouped).forEach(L=>{ const arr=grouped[L], n=arr.length, cx=maxL? innerX+(+L)*colStep : W/2;

    nodes.forEach(nd=>{ const p=pos[nd.id]; if(!p) return;

      ctx.fillStyle='rgba(7,10,12,.94)'; ctx.strokeStyle=col; ctx.lineWidth=1.4;

    const host = document.getElementById('featured'); if(!host) return;
    const feats = (isOwn ? [...MYFEATURED] : ((TARGET_PROFILE && TARGET_PROFILE.featured) || [])).filter(s => /^[A-Za-z0-9]+$/.test(s));
    if(!feats.length){ host.innerHTML = ''; return; }
    try{
      const inList = feats.join(',');
      const [rr, pp] = await Promise.all([
        fetch(`${CFG.supabaseUrl}/rest/v1/renders?slug=in.(${inList})&select=slug,title,description,handle,created_at,media`, { headers: anonHdr }),
        fetch(`${CFG.supabaseUrl}/rest/v1/posts?id=in.(${inList})&select=id,body,handle,uid,created_at,kind,data`, { headers: anonHdr }).catch(() => null),
      ]);
      if(!rr.ok){ host.innerHTML = ''; return; }
      const merged = mergeItems(await rr.json(), (pp && pp.ok) ? await pp.json() : []);
      const byId = {}; merged.forEach(m => { byId[m.slug] = m; });
      const rows = feats.map(s => byId[s]).filter(Boolean);   // keep the creator's chosen order
      if(!rows.length){ host.innerHTML = ''; return; }
      Object.assign(COLORMAP, await fetchColors(rows.map(x => suffixOf(x.handle))));
      Object.assign(LIKEMAP, await fetchLikes(rows.map(x => x.slug)));
      Object.assign(COMMENTMAP, await fetchComments(rows.map(x => x.slug)));
      const grid = document.createElement('div'); grid.className = 's-grid';
      rows.forEach(row => grid.appendChild(row._type === 'rf' ? (row.kind === 'rf_setup' ? buildSetupCard(row) : row.kind === 'rf_audio' ? buildAudioCard(row) : buildRfCard(row)) : row._type === 'text' ? buildTextCard(row) : buildCard(row)));
      host.innerHTML = '<div class="s-label" style="margin:2px 2px 12px;">★ FEATURED</div>';
      host.appendChild(grid);
    }catch(e){ host.innerHTML = ''; }
  }

  async function doDelete(row, token, card){
    const adminDel = !token && !isMine(row.handle) && IS_ADMIN;
    const prompt = token ? 'Delete “' + (row.title || 'this entry') + '”? This can’t be undone.'
      : (adminDel ? '◆ ADMIN — delete “' + (row.title || 'this entry') + '” by @' + (row.handle||'anon') + '? This can’t be undone.'
      : 'We can’t verify you made “' + (row.title || 'this entry') + '” from this device. Delete anyway using your identity?');
    if(!window.confirm(prompt)) return;
    try{
      const fd = new FormData(); fd.append('slug', row.slug); if(token) fd.append('token', token); fd.append('handle', HANDLE || '');
      try{ const sec = await identitySecret(); if(sec) fd.append('secret', sec); }catch(e){}   // authorizes admin delete
      const r = await pxPost('/delete', fd);
      if(!r.ok){ alert('Delete failed (' + r.status + '): ' + await r.text()); return; }
      ALL = ALL.filter(x => x.slug !== row.slug);
      const tok = myTokens(); if(tok[row.slug]){ delete tok[row.slug]; try{ localStorage.setItem('ptxero_my_renders', JSON.stringify(tok)); }catch(e){} }
      card.style.transition = 'opacity .2s'; card.style.opacity = '0'; setTimeout(() => { updateCount(); render(); }, 200);
    }catch(e){ alert('Delete failed: ' + e.message); }
  }
  function updateCount(){ document.getElementById('pfCount').textContent = isOwn ? ALL.filter(r => isMine(r.handle)).length : ALL.length; }
  async function setFilter(f){
    filter = f;
    document.getElementById('tabAll').classList.toggle('on', f==='all');
    document.getElementById('tabFollowing').classList.toggle('on', f==='following');
    document.getElementById('tabMine').classList.toggle('on', f==='mine');
    document.getElementById('tabSaved').classList.toggle('on', f==='saved');
    if(f === 'following' && !FOLLOWFEED){ msg('Loading…'); await loadFollowingFeed(); }
    if(f === 'saved'){ msg('Loading…'); SAVEDFEED = null; await loadSavedFeed(); }   // reload each time (bookmarks change)
    render();
  }

  const wantMine = /(?:^|[?&])me=1/.test(location.search) || location.hash === '#mine';
  // unified feed: renders + text posts, merged newest-first (posts table may not exist yet → graceful)
  async function loadMainFeed(){
    const sel = 'order=created_at.desc&limit=' + (isOwn ? 60 : 100);
    const rq = isOwn
      ? `${CFG.supabaseUrl}/rest/v1/renders?select=slug,title,description,handle,created_at,media&${sel}`
      : `${CFG.supabaseUrl}/rest/v1/renders?handle=ilike.*-${encodeURIComponent(targetUid)}&select=slug,title,description,handle,created_at,media&${sel}`;
    const pq = isOwn
      ? `${CFG.supabaseUrl}/rest/v1/posts?select=id,body,handle,uid,created_at,kind,data&${sel}`
      : `${CFG.supabaseUrl}/rest/v1/posts?handle=ilike.*-${encodeURIComponent(targetUid)}&select=id,body,handle,uid,created_at,kind,data&${sel}`;
    const [rr, pp] = await Promise.all([ fetch(rq, { headers: anonHdr }), fetch(pq, { headers: anonHdr }).catch(() => null) ]);
    if(!rr.ok) throw rr.status;
    const renders = await rr.json();
    const posts = (pp && pp.ok) ? await pp.json() : [];
    return mergeItems(renders, posts);
  }
  function mergeItems(renders, posts){
    const items = (renders || []).map(r => Object.assign({ _type:'render' }, r))
      .concat((posts || []).map(p => ({ _type: (p.kind && p.kind.indexOf('rf') === 0) ? 'rf' : 'text', kind: p.kind || 'text', data: p.data || null, slug:p.id, body:p.body, handle:p.handle, created_at:p.created_at })));
    items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    return items;
  }
  // ── tag browse mode (?tag=foo) — entries whose caption/body contain #foo ──
  async function loadTagFeed(tag){
    const pat = '*%23' + encodeURIComponent(tag) + '*';   // %23 = '#'
    let renders = [], posts = [];
    try{ const r = await fetch(`${CFG.supabaseUrl}/rest/v1/posts?body=ilike.${pat}&select=id,body,handle,uid,created_at,kind,data&order=created_at.desc&limit=100`, { headers: anonHdr }); if(r.ok) posts = await r.json(); }catch(e){}
    try{ const r = await fetch(`${CFG.supabaseUrl}/rest/v1/renders?description=ilike.${pat}&select=slug,title,description,handle,created_at,media&order=created_at.desc&limit=100`, { headers: anonHdr }); if(r.ok) renders = await r.json(); }catch(e){}
    ALL = mergeItems(renders, posts);
    const [cmap, lmap, kmap] = await Promise.all([fetchColors(ALL.map(r => suffixOf(r.handle))), fetchLikes(ALL.map(r => r.slug)), fetchComments(ALL.map(r => r.slug))]);
    COLORMAP = cmap; LIKEMAP = lmap; COMMENTMAP = kmap;
    filter = 'all';
    if(!ALL.length){ msg('No entries tagged <b>#' + esc(tag) + '</b> yet.'); return; }
    render();
  }
  function enterTagMode(tag){
    document.getElementById('pfBox').style.display = 'none';
    const feat = document.getElementById('featured'); if(feat) feat.style.display = 'none';
    document.getElementById('sFilter').style.display = 'none';
    const back = document.getElementById('backFeed'); back.style.display = ''; back.textContent = '← ALL ENTRIES'; back.href = 'social.html';
    const head = document.createElement('div'); head.className = 's-taghead'; head.innerHTML = '<span class="s-tagname">#' + esc(tag) + '</span><span class="s-tagsub">tagged entries</span>';
    const feedEl = document.getElementById('feed'); feedEl.parentNode.insertBefore(head, feedEl);
    document.title = '#' + tag + ' — PTXERO//SOCIAL';
    loadTagFeed(tag);
  }

  if(TAG_MODE){ enterTagMode(rawTag); return; }

  // ── admin moderation queue (?reports=1) ──
  async function enterReportsMode(){
    document.getElementById('pfBox').style.display = 'none';
    const feat = document.getElementById('featured'); if(feat) feat.style.display = 'none';
    document.getElementById('sFilter').style.display = 'none';
    const back = document.getElementById('backFeed'); back.style.display = ''; back.textContent = '← BACK'; back.href = 'social.html';
    const head = document.createElement('div'); head.className = 's-taghead'; head.innerHTML = '<span class="s-tagname">◆ MODERATION</span><span class="s-tagsub">open reports</span>';
    const feedEl = document.getElementById('feed'); feedEl.parentNode.insertBefore(head, feedEl);
    document.title = 'Moderation — PTXERO//SOCIAL';
    if(!IS_ADMIN){ msg('Admins only.'); return; }
    msg('Loading reports…');
    let reports = [];
    try{
      const secret = await identitySecret();
      const fd = new FormData(); fd.append('uid', MY_SUFFIX); fd.append('secret', secret || ''); fd.append('action', 'list');
      const r = await pxPost('/report', fd);
      if(r.ok){ reports = (await r.json()).reports || []; }
    }catch(e){}
    if(!reports.length){ msg('No open reports. All clear.'); return; }
    const list = document.createElement('div'); list.className = 's-reports';
    reports.forEach(rep => {
      const href = (rep.kind === 'text') ? ('ascii-render/view.html?p=' + encodeURIComponent(rep.target)) : ('ascii-render/view.html?r=' + encodeURIComponent(rep.target));
      const when = rep.created_at ? new Date(rep.created_at).toLocaleString() : '';
      const el = document.createElement('div'); el.className = 's-report';
      el.innerHTML = '<div class="s-rmeta"><a class="s-rlink" href="' + href + '">' + esc(rep.kind) + ' · ' + esc(rep.target) + '</a><span class="s-rwhen">' + esc(when) + '</span></div>'
        + '<div class="s-rreason">' + (rep.reason ? esc(rep.reason) : '<i>no reason given</i>') + '</div>'
        + '<div class="s-rby">reported by @' + esc(rep.reporter) + '</div>';
      const acts = document.createElement('div'); acts.className = 's-ractions';
      const open = document.createElement('a'); open.className = 's-cta'; open.href = href; open.textContent = 'OPEN ENTRY';
      const resolve = document.createElement('button'); resolve.className = 's-cta'; resolve.type = 'button'; resolve.textContent = '✓ RESOLVE';
      resolve.onclick = async () => {
        resolve.disabled = true;
        try{
          const secret = await identitySecret();
          const fd = new FormData(); fd.append('uid', MY_SUFFIX); fd.append('secret', secret || ''); fd.append('action', 'resolve'); fd.append('id', rep.id);
          const r = await pxPost('/report', fd); if(!r.ok) throw new Error();
          el.style.opacity = '.4'; resolve.textContent = 'RESOLVED';
        }catch(e){ resolve.disabled = false; alert('Could not resolve.'); }
      };
      acts.append(open, resolve); el.appendChild(acts);
      list.appendChild(el);
    });
    feedEl.innerHTML = ''; feedEl.appendChild(list);
  }
  // ── LIVE NOW rail: who's ON AIR / LISTENING right now (RF-as-entry P3) ──
  (function initLiveRail(){
    const rail = document.getElementById('liveNow'); if(!rail) return;
    const css = document.createElement('style'); css.textContent =
      '.live-rail{margin:12px 0 14px;border:1px solid rgba(66,212,245,.22);border-radius:4px;background:linear-gradient(180deg,rgba(66,212,245,.05),rgba(3,6,8,0));padding:8px 10px;}'
     +'.lr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}'
     +'.lr-title{font-size:11px;letter-spacing:.14em;color:#42d4f5;font-weight:700;white-space:nowrap;}'
     +'.lr-you{margin-left:auto;display:flex;align-items:center;gap:4px;}'
     +'.lr-you-lbl{font-size:8px;letter-spacing:.14em;color:#5a5a70;text-transform:uppercase;}'
     +'.lr-you-opt{cursor:pointer;font-family:inherit;font-size:8px;letter-spacing:.08em;padding:3px 6px;border-radius:2px;border:1px solid rgba(90,90,112,.4);background:transparent;color:#5a5a70;text-transform:uppercase;}'
     +'.lr-you-opt.on{border-color:#42d4f5;color:#42d4f5;background:rgba(66,212,245,.1);}'
     +'.lr-self{font-size:9px;letter-spacing:.06em;padding:2px 7px;border-radius:2px;white-space:nowrap;border:1px solid transparent;}'
     +'.lr-self.onair{color:#ff3b3b;border-color:rgba(255,59,59,.4);} .lr-self.listen{color:#00ff50;border-color:rgba(0,255,80,.35);} .lr-self.idle{color:#5a5a70;}'
     +'.pf-live{display:inline-flex;align-items:center;gap:4px;font-size:9px;letter-spacing:.08em;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:8px;border:1px solid transparent;font-family:var(--fmono,monospace);}'
     +'.pf-live.onair{color:#ff3b3b;border-color:rgba(255,59,59,.5);background:rgba(255,59,59,.08);}'
     +'.pf-live.listen{color:#00ff50;border-color:rgba(0,255,80,.4);background:rgba(0,255,80,.07);}'
     +'.lr-track{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin;}'
     +'.lr-empty{font-size:10px;letter-spacing:.06em;color:#454558;padding:7px 0 2px;}'
     +'.lr-pill{flex:0 0 auto;display:flex;align-items:center;gap:6px;text-decoration:none;padding:5px 9px;border-radius:999px;border:1px solid rgba(90,90,112,.35);background:rgba(8,12,16,.6);max-width:230px;}'
     +'.lr-pill .lr-ic{font-size:11px;line-height:1;}'
     +'.lr-pill.onair{border-color:rgba(255,59,59,.55);} .lr-pill.onair .lr-ic{color:#ff3b3b;animation:lrPulse 1.3s ease-in-out infinite;}'
     +'.lr-pill.listen{border-color:rgba(0,255,80,.4);} .lr-pill.listen .lr-ic{color:#00ff50;}'
     +'.lr-h{font-size:11px;color:#d8d8e0;white-space:nowrap;}'
     +'.lr-m{font-size:9px;color:#6a6a80;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}'
     +'@keyframes lrPulse{0%,100%{opacity:.5;}50%{opacity:1;}}';
    document.head.appendChild(css);

    const PRIV_KEY='ptxero_presence_privacy';
    const getPriv=()=>{ try{ const v=localStorage.getItem(PRIV_KEY); return ['off','followers','public'].includes(v)?v:'public'; }catch(e){ return 'public'; } };
    const setPriv=(v)=>{ try{ localStorage.setItem(PRIV_KEY, v); }catch(e){} };
    const ICON={on_air:'◉',listening:'▶'}, WORD={on_air:'ON AIR',listening:'LISTENING'};
    let latest=[];

    function youControl(){
      const cur=getPriv();
      const opt=(v,t)=>'<button class="lr-you-opt'+(cur===v?' on':'')+'" data-pv="'+v+'">'+t+'</button>';
      return '<span class="lr-you" title="Your ON AIR / LISTENING status is broadcast from the RF app. This sets who can see it.">'
           + '<span class="lr-you-lbl">you</span>'+opt('off','off')+opt('followers','flw')+opt('public','pub')+'</span>';
    }
    function pill(p){
      const meta = p.label ? esc(String(p.label).slice(0,28)) : (p.freq!=null?(Number(p.freq).toFixed(1)+' MHz'):'');
      const h = esc(p.handle||('RF-'+p.uid));
      return '<a class="lr-pill '+(p.state==='on_air'?'onair':'listen')+'" href="social.html?u='+encodeURIComponent(p.uid)+'" title="@'+h+' — '+(WORD[p.state]||'')+(meta?(' · '+meta):'')+'">'
           + '<span class="lr-ic">'+(ICON[p.state]||'•')+'</span><span class="lr-h">@'+h+'</span>'
           + (meta?('<span class="lr-m">'+meta+'</span>'):'') + '</a>';
    }
    function selfStatus(){
      const me=(latest||[]).find(p=>p.uid===MY_SUFFIX);
      if(me && (me.state==='on_air'||me.state==='listening')){
        const meta=me.label?esc(String(me.label).slice(0,24)):(me.freq!=null?Number(me.freq).toFixed(1)+' MHz':'');
        return '<span class="lr-self '+(me.state==='on_air'?'onair':'listen')+'">'+(ICON[me.state]||'•')+' '+(WORD[me.state]||'')+(meta?(' · '+meta):'')+'</span>';
      }
      return '<span class="lr-self idle">○ you’re idle</span>';
    }
    // CONNECT link: rebuild their listening context in RF (location → same station).
    function connectHref(p){
      if(p.freq==null) return null;
      let u='rf/?tune='+encodeURIComponent(Number(p.freq).toFixed(1));
      if(p.lat!=null && p.lon!=null){ u+='&lat='+encodeURIComponent(p.lat)+'&lon='+encodeURIComponent(p.lon); }
      if(p.label) u+='&name='+encodeURIComponent(String(p.label).slice(0,40));
      return u;
    }
    // Live status badge + CONNECT button on the currently-viewed profile header.
    function paintProfileLive(){
      const el=document.getElementById('pfLive');
      const acts=document.getElementById('pfLiveActions'), cn=document.getElementById('pfConnect');
      const puid=(typeof targetUid!=='undefined' && targetUid) ? targetUid : MY_SUFFIX;
      const isSelf=(puid===MY_SUFFIX);
      const me=(latest||[]).find(p=>p.uid===puid && (p.state==='on_air'||p.state==='listening'));
      if(el){
        if(!me){ el.style.display='none'; el.textContent=''; el.className='pf-live'; }
        else{
          const meta=me.label?String(me.label).slice(0,26):(me.freq!=null?Number(me.freq).toFixed(1)+' MHz':'');
          const word=me.state==='on_air'?'ON AIR':'LISTENING NOW';
          el.className='pf-live '+(me.state==='on_air'?'onair':'listen');
          el.textContent=(ICON[me.state]||'•')+' '+word+(meta?(' · '+meta):'');
          el.style.display='';
        }
      }
      if(acts && cn){
        const href=(me && !isSelf) ? connectHref(me) : null;
        if(href){ cn.href=href; cn.textContent=(me.state==='on_air'?'◎ TUNE IN':'◎ CONNECT'); acts.style.display=''; }
        else { acts.style.display='none'; cn.removeAttribute('href'); }
      }
    }
    function paint(){
      const list=(latest||[]).filter(p=>p.uid!==MY_SUFFIX && (p.state==='on_air'||p.state==='listening'));
      const body = list.length ? ('<div class="lr-track">'+list.slice(0,40).map(pill).join('')+'</div>')
                               : '<div class="lr-empty">— no one else is broadcasting right now —</div>';
      rail.innerHTML='<div class="lr-top"><span class="lr-title">((•)) LIVE NOW</span>'+selfStatus()+youControl()+'</div>'+body;
      rail.style.display='';
      [].slice.call(rail.querySelectorAll('.lr-you-opt')).forEach(b=>b.addEventListener('click',()=>{ setPriv(b.dataset.pv); paint(); }));
      paintProfileLive();
    }
    async function poll(){
      if(workerBase){
        try{ const r=await fetch(workerBase+'/presence?viewer='+encodeURIComponent(MY_SUFFIX||''),{cache:'no-store'});
             if(r.ok){ const j=await r.json(); latest=Array.isArray(j.roster)?j.roster:[]; } }catch(e){}
      }
      paint();
    }
    paint(); poll();
    setInterval(()=>{ if(!document.hidden) poll(); }, 20000);
  })();

  if(REPORTS_MODE){ enterReportsMode(); return; }

  loadMainFeed()
    .then(items => {
      ALL = items || []; updateCount();
      Promise.all([fetchColors(ALL.map(r => suffixOf(r.handle))), fetchLikes(ALL.map(r => r.slug)), fetchComments(ALL.map(r => r.slug))])
        .then(([cmap, lmap, kmap]) => { COLORMAP = cmap; LIKEMAP = lmap; COMMENTMAP = kmap; setFilter(isOwn && wantMine ? 'mine' : 'all'); });
    })
    .catch(err => msg('Could not load the feed (' + esc(String(err)) + ').<br>The backend may be waking up — try again shortly.'))
    .finally(() => { if(isOwn) maybeOnboard(wasExisting); });
})();
</script>
